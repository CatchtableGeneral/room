<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>회의실 스케줄 (초안)</title>
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:"Pretendard",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:#14161b;color:#e9ebef;}
  .app{position:fixed;inset:0;height:100vh;width:100vw;display:flex;flex-direction:column;padding:2vh 2vw;}

  .top{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;margin-bottom:1.4vh;}
  .top .l{display:flex;align-items:center;gap:14px;}
  .top .brandlogo{height:26px;width:auto;display:block;}
  .top .ttl{font-size:19px;font-weight:700;color:#c8ccd3;}
  .top .legend{display:flex;gap:14px;margin-left:8px;font-size:13px;font-weight:700;}
  .top .legend .lg-busy{color:#FF6B7D;} .top .legend .lg-ending{color:#3FD3D3;} .top .legend .lg-soon{color:#FFB259;} .top .legend .lg-free{color:#2FCB84;}
  .top .r{text-align:right;}
  .top .date{font-size:16px;color:#8a9099;font-weight:600;}
  .top .clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:#f2f3f5;line-height:1.1;}

  .cal{flex:1 1 0;display:flex;flex-direction:column;min-height:0;border:1px solid #262a32;border-radius:14px;overflow:hidden;background:#161a20;}
  /* 상단 시간축 (가로) */
  .cal-top{display:flex;flex:0 0 40px;border-bottom:1px solid #262a32;background:#1a1e25;}
  .corner{width:170px;flex:0 0 170px;border-right:1px solid #262a32;}
  .taxis{flex:1 1 auto;position:relative;}
  .taxis .tl{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;color:#7a808a;font-weight:700;padding-left:6px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .taxis .tl .daymark{color:#FD3D00;font-weight:800;margin-right:4px;}

  .cal-rows{flex:1 1 0;position:relative;display:flex;flex-direction:column;min-height:0;}
  .ohdr{flex:0 0 auto;padding:5px 14px;font-size:12px;font-weight:800;letter-spacing:1.2px;color:#FD3D00;background:#191d24;border-bottom:1px solid #23272f;}
  .rrow{flex:1 1 0;display:flex;min-height:0;border-bottom:1px solid #1c2027;border-left:5px solid transparent;transition:background .3s;}
  .rrow.r-busy{border-left-color:#FF2D55;}
  .rrow.r-soon{border-left-color:#FF9500;}
  .rrow.r-free{border-left-color:#2FCB84;}
  .rrow.r-ending{border-left-color:#22C7C7;}
  .rname .rstat{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:0.3px;white-space:nowrap;}
  .r-busy .rstat{color:#FF6B7D;} .r-soon .rstat{color:#FFB259;} .r-free .rstat{color:#7f8791;} .r-ending .rstat{color:#3FD3D3;}
  .r-ending .rname .dot{background:#22C7C7;box-shadow:0 0 9px #22C7C7;}
  .rrow:last-child{border-bottom:none;}
  .rname{width:170px;flex:0 0 170px;display:flex;align-items:center;gap:9px;padding:0 14px;border-right:1px solid #262a32;font-size:15.5px;font-weight:700;color:#f1f3f5;white-space:nowrap;overflow:hidden;}
  .rname .dot{width:10px;height:10px;border-radius:50%;background:#4a4f57;flex:none;}   /* 현재 상태등: 상태색으로 */
  .r-busy .rname .dot{background:#FF2D55;box-shadow:0 0 9px #FF2D55;}
  .r-soon .rname .dot{background:#FF9500;box-shadow:0 0 9px #FF9500;}
  .r-free .rname .dot{background:#2FCB84;box-shadow:0 0 9px #2FCB84;}
  .rtrack{flex:1 1 auto;position:relative;background:repeating-linear-gradient(to right,#20242c 0 1px,transparent 1px var(--colstep,calc(100%/9)));}

  .ev{position:absolute;top:5px;bottom:5px;border-radius:6px;padding:3px 8px;overflow:hidden;border-left:3px solid var(--ec);background:var(--eb);display:flex;flex-direction:column;justify-content:center;}
  .ev .et{font-size:13px;font-weight:700;color:#f6f7f9;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ev .em{font-size:10.5px;color:#aab0bb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;margin-top:1px;}
  .ev.narrow .em{display:none;}          /* 짧은 회의: 부제 숨기고 제목만 */
  .ev.past{opacity:0.42;}                 /* 완전히 끝난 회의만 흐리게 */
  .ev.now{opacity:1;box-shadow:0 0 0 2px #FF2D55, 0 0 14px rgba(255,45,85,0.55);border-left-color:#FF2D55;}
  .ev.now .et{color:#fff;}
  /* 예약 가능(빈) 시간대 — 초록 */
  .ev.slotfree{background:rgba(47,203,132,0.10);border-left:3px dashed #2FCB84;}
  .ev.slotfree .et{color:#2FCB84;font-weight:700;}
  .ev.slotfree .em{color:#4fae86;}

  /* 지금 시각 (세로 라인) */
  .nowoverlay{position:absolute;left:170px;right:0;top:0;bottom:0;pointer-events:none;}
  .nowvline{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #FD3D00;}
  .nowvline .dot{position:absolute;top:-4px;left:-4px;width:8px;height:8px;border-radius:50%;background:#FD3D00;}
  .nowvline .tag{position:absolute;top:2px;left:5px;background:#FD3D00;color:#fff;font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;font-variant-numeric:tabular-nums;}

  .draft{position:fixed;bottom:1vh;right:1.4vw;font-size:11px;color:#4a4f57;font-weight:600;}
  /* 운영시간 외 커버: 검정 + 로고만 */
  .cover{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:100;}
  .cover.on{display:flex;}
  .cover img{width:32vw;max-width:560px;height:auto;}
</style>
</head>

<script>
  // 롤링 창: 지금(정시) 기준 WINDOW_HOURS 시간만 표시. 시간이 흐르면 왼쪽(과거)은 사라지고 오른쪽(내일까지)이 등장.
  var WINDOW_HOURS=(function(){var v=parseInt(new URLSearchParams(location.search).get('win'),10);return (v>=2&&v<=16)?v:5;})();
  var PAST_MIN=60;      // 현재 시각 왼쪽에 보여줄 과거 분량(=현재를 2번째 칸에)
  var STEP_MS=15*60000; // 롤링 단위 15분
  var winStart=0, winEnd=0, TOTAL=1;   // ms 절대시각
  function winStartFor(t){ return Math.floor(t/STEP_MS)*STEP_MS - PAST_MIN*60000; }  // 15분 내림 - 1시간
  function computeWindow(){ winStart=winStartFor(Date.now()); winEnd=winStart+WINDOW_HOURS*3600000; TOTAL=winEnd-winStart; }
  // ▼ 회의실 디스플레이(index)와 동일한 Apps Script 백엔드 ▼
  var APPS_URL="https://script.google.com/macros/s/AKfycbyfD-wzNoO_j-t-k2J66D6vZOzpv8cftt7Bj9Ay-pBwTGDYuumrGD8osh3I9dx9uI4/exec";
  var TYPEC={
    general:{c:'#378ADD',b:'rgba(55,138,221,0.16)'},
    interview:{c:'#7F77DD',b:'rgba(127,119,221,0.16)'},
    video:{c:'#C15FB0',b:'rgba(193,95,176,0.18)'}
  };

  // 방키(index/GAS와 동일) · 사무실 · 유형. 데이터는 백엔드에서 채움.
  var OFFICES=['판교 A','판교 B','페이'];
  var ROOMS=[
    {n:'Cuisine',key:'cuisine',of:'판교 A',t:'general'},
    {n:'Savor',key:'savor',of:'판교 A',t:'general'},
    {n:'Corkage',key:'corkage',of:'판교 A',t:'general'},
    {n:'Dining',key:'dining',of:'판교 A',t:'general'},
    {n:'Pairing',key:'pairing',of:'판교 A',t:'general'},
    {n:'Gourmet',key:'gourmet',of:'판교 A',t:'general'},
    {n:'Cooking',key:'cooking',of:'판교 A',t:'general'},
    {n:'Plating',key:'plating',of:'판교 A',t:'general'},
    {n:'Tasting',key:'tasting',of:'판교 A',t:'general'},
    {n:'Terrace',key:'terrace',of:'판교 B',t:'general'},
    {n:'Roasting',key:'roasting',of:'판교 B',t:'general'},
    {n:'Baking',key:'baking',of:'판교 B',t:'general'},
    {n:'Interview 1',key:'interview1',of:'판교 B',t:'interview'},
    {n:'Interview 2',key:'interview2',of:'판교 B',t:'interview'},
    {n:'Party',key:'party',of:'판교 B',t:'video'},
    {n:'Flavor',key:'flavor',of:'페이',t:'general'}
  ];

  function pad(n){return('0'+n).slice(-2);}
  function fmtMs(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function setConn(ok){var el=document.getElementById('conn');if(el)el.textContent=ok?'실시간 연동':'연결 재시도 중…';}
  var MG=15*60000;   // 예약가능 최소 간격 15분

  var REFS=[], lastRooms=null;
  function build(){
    var rows=document.getElementById('rows');
    REFS=[];
    OFFICES.forEach(function(of){
      var hdr=document.createElement('div'); hdr.className='ohdr'; hdr.textContent=of;
      rows.appendChild(hdr);
      ROOMS.filter(function(r){return r.of===of;}).forEach(function(r){
        var row=document.createElement('div'); row.className='rrow';
        var nm=document.createElement('div'); nm.className='rname';
        nm.innerHTML='<span class="dot"></span>'+r.n+'<span class="rstat"></span>';
        var tr=document.createElement('div'); tr.className='rtrack';
        row.appendChild(nm); row.appendChild(tr); rows.appendChild(row);
        REFS.push({row:row,stat:nm.querySelector('.rstat'),track:tr,key:r.key,t:r.t,ev:[]});
      });
    });
    var ov=document.createElement('div'); ov.className='nowoverlay'; ov.id='nowov';
    rows.appendChild(ov);
  }

  // 시간축(창 기준 1시간 간격) — 자정 넘어가면 '내일 MM/DD' 표시
  function buildAxis(){
    var ta=document.getElementById('taxis'); ta.innerHTML='';
    document.documentElement.style.setProperty('--colstep',(100/WINDOW_HOURS)+'%');
    var startDate=new Date(winStart).getDate(), markedT=false;
    for(var i=0;i<WINDOW_HOURS;i++){
      var t=winStart+i*3600000, dt=new Date(t), timeTxt=fmtMs(t);
      var lb=document.createElement('div'); lb.className='tl'; lb.style.left=((i/WINDOW_HOURS)*100)+'%';
      if(dt.getDate()!==startDate && !markedT){         // 자정 넘긴 첫 라벨에 '내일'
        markedT=true;
        lb.innerHTML='<span class="daymark">'+pad(dt.getMonth()+1)+'/'+pad(dt.getDate())+' 내일</span>'+timeTxt;
      } else {
        lb.textContent=timeTxt;
      }
      ta.appendChild(lb);
    }
  }

  function nowLine(){
    var ov=document.getElementById('nowov'); if(!ov) return;
    ov.innerHTML='';
    var now=Date.now();
    if(now<winStart||now>winEnd) return;
    var left=(now-winStart)/TOTAL*100;
    var ln=document.createElement('div'); ln.className='nowvline'; ln.style.left=left+'%';
    ln.innerHTML='<span class="dot"></span><span class="tag">'+fmtMs(now)+'</span>';
    ov.appendChild(ln);
  }

  function refreshStatus(){
    var now=Date.now();
    REFS.forEach(function(rf){
      var busy=false, soonMs=Infinity, curEnd=0;
      rf.ev.forEach(function(x){
        var s=x.ev.s, e=x.ev.e;
        x.el.classList.remove('past','now');
        if(s<=now && now<e){ busy=true; x.el.classList.add('now'); curEnd=Math.max(curEnd,e); }
        else if(e<=now){ x.el.classList.add('past'); }
        else if(s>now){ soonMs=Math.min(soonMs, s-now); }
      });
      var cls, label;
      if(busy){
        if(curEnd-now<=5*60000){ cls='r-ending'; label='곧 종료'; }
        else { cls='r-busy'; label='사용 중'; }
      }
      else if(soonMs<=5*60000){ cls='r-soon'; label='곧 시작'; }
      else { cls='r-free'; label='비어 있음'; }
      rf.row.classList.remove('r-busy','r-soon','r-free','r-ending'); rf.row.classList.add(cls);
      rf.stat.textContent=label;
      renderFreeSlots(rf, now);
    });
  }

  // 예약 가능(빈) 구간 초록 블록: 지금부터 창 끝까지, 15분 이상 빈 곳만
  function renderFreeSlots(rf, now){
    var tr=rf.track; if(!tr) return;
    tr.querySelectorAll('.slotfree').forEach(function(x){x.remove();});
    var base=Math.max(now, winStart);
    if(base>=winEnd) return;
    var evs=rf.ev.map(function(x){return x.ev;}).filter(function(e){return e.e>base;}).sort(function(a,b){return a.s-b.s;});
    var p=base;
    var add=function(s,e){
      if(e-s<MG) return;
      var vs=Math.max(s,winStart), ve=Math.min(e,winEnd); if(ve<=vs) return;
      var left=(vs-winStart)/TOTAL*100, w=(ve-vs)/TOTAL*100;
      var d=document.createElement('div'); d.className='ev slotfree';
      d.style.left='calc('+left+'% + 1px)'; d.style.width='calc('+w+'% - 2px)';
      d.innerHTML='<div class="et">예약 가능</div><div class="em">'+fmtMs(s)+'–'+fmtMs(e)+'</div>';
      if((e-s)<45*60000) d.classList.add('narrow');
      tr.appendChild(d);
    };
    evs.forEach(function(e){ if(e.s>p) add(p, e.s); p=Math.max(p, e.e); });
    if(winEnd>p) add(p, winEnd);
  }

  // 한 방의 일정 블록을 현재 창 기준으로 다시 그림
  function renderRoomEvents(rf, evs){
    var tr=rf.track; tr.querySelectorAll('.ev').forEach(function(x){x.remove();});
    var tc=TYPEC[rf.t]||TYPEC.general; rf.ev=[];
    (evs||[]).forEach(function(ev){
      var vs=Math.max(ev.s, winStart), ve=Math.min(ev.e, winEnd);
      if(ve<=vs) return;                        // 창(롤링 범위) 밖이면 스킵 → 지난 건 왼쪽으로 사라짐
      var left=(vs-winStart)/TOTAL*100, w=(ve-vs)/TOTAL*100;
      var d=document.createElement('div'); d.className='ev'+((ev.e-ev.s)<45*60000?' narrow':'');
      d.style.left='calc('+left+'% + 1px)'; d.style.width='calc('+w+'% - 2px)';
      d.style.setProperty('--ec',tc.c); d.style.setProperty('--eb',tc.b);
      d.innerHTML='<div class="et">'+esc(ev.t)+'</div><div class="em">'+fmtMs(ev.s)+'–'+fmtMs(ev.e)+'</div>';
      tr.appendChild(d); rf.ev.push({el:d,ev:ev});
    });
  }

  // flex가 안 먹는 브라우저(TV Bro 등) 대비: 화면 높이를 픽셀로 직접 분배해 세로를 꽉 채움
  function vpH(){   // TV Bro(Gecko) 등에서 innerHeight가 어긋나므로 가장 신뢰도 높은 값 사용
    var a=(window.visualViewport&&window.visualViewport.height)||0;
    var b=document.documentElement&&document.documentElement.clientHeight||0;
    var c=window.innerHeight||0;
    return Math.max(a,b,c)||c||b||600;
  }
  function layoutHeights(){
    var vh=vpH();
    var app=document.querySelector('.app'); if(!app) return;
    var topEl=document.querySelector('.top'), cal=document.querySelector('.cal');
    var caltop=document.querySelector('.cal-top'), rows=document.getElementById('rows');
    if(!(topEl&&cal&&caltop&&rows)) return;
    app.style.height=vh+'px';
    var cs=getComputedStyle(app), pad=parseFloat(cs.paddingTop||0)+parseFloat(cs.paddingBottom||0);
    var topM=parseFloat(getComputedStyle(topEl).marginBottom||0);
    var calH=Math.max(200, vh - pad - topEl.offsetHeight - topM);
    cal.style.height=calH+'px'; cal.style.flex='none';
    var rowsH=Math.max(120, calH - caltop.offsetHeight - 2);
    rows.style.height=rowsH+'px'; rows.style.flex='none';
    var hdrH=0; rows.querySelectorAll('.ohdr').forEach(function(h){hdrH+=h.offsetHeight;});
    var per=Math.max(28, Math.floor((rowsH - hdrH)/(REFS.length||1)));
    REFS.forEach(function(rf){ rf.row.style.height=per+'px'; rf.row.style.flex='none'; });
  }

  // 창 계산 후 축·이벤트·상태 전체 재배치
  function layoutAll(){
    computeWindow(); layoutHeights(); buildAxis();
    REFS.forEach(function(rf){ renderRoomEvents(rf, lastRooms?lastRooms[rf.key]:[]); });
    nowLine(); refreshStatus();
  }

  // 백엔드(all=1) 응답 → 절대시각(ms) 이벤트로 저장 후 배치
  function applyData(data){
    if(!(data && data.rooms)) return false;
    lastRooms={};
    REFS.forEach(function(rf){
      var rd=data.rooms[rf.key], evs=[];
      if(rd && rd.events){
        rd.events.forEach(function(e){
          var s=+e.start, en=+e.end; if(!(en>s)) return;
          var t = (rf.t==='interview') ? '인터뷰 일정' : ((e.title&&e.title.length)?e.title:'예약됨');
          evs.push({s:s,e:en,t:t});
        });
        evs.sort(function(a,b){return a.s-b.s;});
      }
      lastRooms[rf.key]=evs;
    });
    layoutAll(); setConn(true);
    return true;
  }

  function loadReal(){
    if(!APPS_URL) return;
    fetch(APPS_URL+'?all=1&span=2',{credentials:'omit'}).then(function(r){return r.json();}).then(function(d){ if(!applyData(d)) throw 0; }).catch(function(){
      var cb='cal_'+Math.random().toString(36).slice(2);           // JSONP 폴백(쿠키/CORS 우회)
      var s=document.createElement('script'); var done=false;
      var clean=function(){try{delete window[cb];s.remove();}catch(e){}};
      window[cb]=function(d){ if(done)return; done=true; applyData(d); clean(); };
      s.onerror=function(){ if(done)return; done=true; setConn(false); clean(); };
      s.src=APPS_URL+'?all=1&span=2&callback='+cb;
      document.head.appendChild(s);
      setTimeout(function(){ if(!done){done=true; setConn(false); clean();} }, 15000);
    });
  }

  // 운영시간(07:50~23:00) 외에는 검정+로고 커버. ?cover=1/0 로 강제(확인용)
  function getParam(k){ return new URLSearchParams(location.search).get(k); }
  function refreshCover(){
    var c=document.getElementById('cover'); if(!c) return;
    var d=new Date(), m=d.getHours()*60+d.getMinutes();
    var show = !(m>=(7*60+50) && m<(23*60));
    var f=getParam('cover'); if(f==='1') show=true; else if(f==='0') show=false;
    var img=document.getElementById('coverImg');
    if(img && !img.getAttribute('src')){ var b=document.querySelector('.brandlogo'); if(b) img.src=b.src; }
    c.classList.toggle('on', show);
  }

  function tick(){
    var d=new Date(), wd=['일','월','화','수','목','금','토'][d.getDay()];
    document.getElementById('date').textContent=d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' ('+wd+')';
    document.getElementById('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
    if(winStartFor(Date.now())!==winStart){ layoutAll(); }   // 15분 단위로 창 롤링
    else { nowLine(); refreshStatus(); }
    refreshCover();
  }

  build(); layoutAll(); tick(); loadReal();
  window.addEventListener('resize', layoutAll);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', layoutAll);
  window.addEventListener('load', layoutAll);   // 폰트·뷰포트 확정 후
  // TV Bro 등에서 뷰포트가 늦게 확정되므로 여러 시점에 재계산
  [100,400,900,1800,3000].forEach(function(ms){ setTimeout(layoutHeights, ms); });
  setInterval(tick,30000);        // 시계·지금선·상태 갱신(정시마다 롤링)
  setInterval(loadReal,60000);    // 실제 일정 60초마다 재조회
</script>
</body>
