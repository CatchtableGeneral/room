<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>회의실 스케줄 (초안)</title>
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:"Pretendard",sans-serif;-webkit-font-smoothing:antialiased;background:#14161b;color:#e9ebef;}
  .app{position:fixed;inset:0;display:flex;flex-direction:column;padding:2vh 2vw;}

  .top{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;margin-bottom:1.4vh;}
  .top .l{display:flex;align-items:center;gap:14px;}
  .top .brand{font-size:22px;font-weight:900;letter-spacing:2px;color:#FD3D00;}
  .top .ttl{font-size:19px;font-weight:700;color:#c8ccd3;}
  .top .legend{display:flex;gap:14px;margin-left:8px;font-size:13px;font-weight:700;}
  .top .legend .lg-busy{color:#FF6B7D;} .top .legend .lg-soon{color:#FFB259;} .top .legend .lg-free{color:#2FCB84;}
  .top .r{text-align:right;}
  .top .date{font-size:16px;color:#8a9099;font-weight:600;}
  .top .clock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:#f2f3f5;line-height:1.1;}

  .cal{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;border:1px solid #262a32;border-radius:14px;overflow:hidden;background:#161a20;}
  /* 상단 시간축 (가로) */
  .cal-top{display:flex;flex:0 0 40px;border-bottom:1px solid #262a32;background:#1a1e25;}
  .corner{width:170px;flex:0 0 170px;border-right:1px solid #262a32;}
  .taxis{flex:1 1 auto;position:relative;}
  .taxis .tl{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;color:#7a808a;font-weight:700;padding-left:6px;font-variant-numeric:tabular-nums;}

  .cal-rows{flex:1 1 auto;position:relative;display:flex;flex-direction:column;min-height:0;}
  .ohdr{flex:0 0 auto;padding:5px 14px;font-size:12px;font-weight:800;letter-spacing:1.2px;color:#FD3D00;background:#191d24;border-bottom:1px solid #23272f;}
  .rrow{flex:1 1 0;display:flex;min-height:0;border-bottom:1px solid #1c2027;border-left:5px solid transparent;transition:background .3s;}
  .rrow.r-busy{border-left-color:#FF2D55;}
  .rrow.r-soon{border-left-color:#FF9500;}
  .rrow.r-free{border-left-color:#2FCB84;}
  .rname .rstat{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:0.3px;white-space:nowrap;}
  .r-busy .rstat{color:#FF6B7D;} .r-soon .rstat{color:#FFB259;} .r-free .rstat{color:#7f8791;}
  .rrow:last-child{border-bottom:none;}
  .rname{width:170px;flex:0 0 170px;display:flex;align-items:center;gap:9px;padding:0 14px;border-right:1px solid #262a32;font-size:14.5px;font-weight:700;color:#eef0f3;white-space:nowrap;overflow:hidden;}
  .rname .dot{width:10px;height:10px;border-radius:50%;background:#4a4f57;flex:none;}   /* 현재 상태등: 상태색으로 */
  .r-busy .rname .dot{background:#FF2D55;box-shadow:0 0 9px #FF2D55;}
  .r-soon .rname .dot{background:#FF9500;box-shadow:0 0 9px #FF9500;}
  .r-free .rname .dot{background:#2FCB84;box-shadow:0 0 9px #2FCB84;}
  .rtrack{flex:1 1 auto;position:relative;background:repeating-linear-gradient(to right,#20242c 0 1px,transparent 1px calc(100%/15));}

  .ev{position:absolute;top:5px;bottom:5px;border-radius:6px;padding:3px 8px;overflow:hidden;border-left:3px solid var(--ec);background:var(--eb);display:flex;flex-direction:column;justify-content:center;}
  .ev .et{font-size:12px;font-weight:700;color:#f2f3f5;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;}
  .ev .em{font-size:10.5px;color:#aab0bb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;margin-top:1px;}
  .ev.narrow .em{display:none;}          /* 짧은 회의: 부제 숨기고 제목만 */
  .ev.past{opacity:0.42;}                 /* 완전히 끝난 회의만 흐리게 */
  .ev.now{opacity:1;box-shadow:0 0 0 2px #FF2D55, 0 0 14px rgba(255,45,85,0.55);border-left-color:#FF2D55;}
  .ev.now .et{color:#fff;}
  /* 예약 가능(빈) 시간대 — 초록 */
  .ev.slotfree{background:rgba(47,203,132,0.10);border-left:3px dashed #2FCB84;}
  .ev.slotfree .et{color:#2FCB84;font-weight:700;}
  .ev.slotfree .em{color:#4fae86;}

  /* 지금 시각 (세로 라인) */
  .nowoverlay{position:absolute;left:170px;right:0;top:0;bottom:0;pointer-events:none;}
  .nowvline{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #FD3D00;}
  .nowvline .dot{position:absolute;top:-4px;left:-4px;width:8px;height:8px;border-radius:50%;background:#FD3D00;}
  .nowvline .tag{position:absolute;top:2px;left:5px;background:#FD3D00;color:#fff;font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;font-variant-numeric:tabular-nums;}

  .draft{position:fixed;bottom:1vh;right:1.4vw;font-size:11px;color:#4a4f57;font-weight:600;}
</style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="l"><span class="brand">CATCHTABLE</span><span class="ttl">회의실 스케줄</span>
        <span class="legend"><span class="lg lg-busy">● 사용 중</span><span class="lg lg-soon">● 곧 예정</span><span class="lg lg-free">● 비어 있음</span></span>
      </div>
      <div class="r"><div class="date" id="date">—</div><div class="clock" id="clock">—</div></div>
    </div>
    <div class="cal">
      <div class="cal-top"><div class="corner"></div><div class="taxis" id="taxis"></div></div>
      <div class="cal-rows" id="rows"></div>
    </div>
  </div>
  <div class="draft">초안 · 샘플 데이터</div>

<script>
  var START=8, END=23, TOTAL=(END-START)*60;
  var TYPEC={
    general:{c:'#378ADD',b:'rgba(55,138,221,0.16)'},
    interview:{c:'#7F77DD',b:'rgba(127,119,221,0.16)'},
    video:{c:'#1D9E75',b:'rgba(29,158,117,0.16)'}
  };
  function m(h,mm){return h*60+mm;}

  var OFFICES=['판교 A','판교 B','페이'];
  var ROOMS=[
    {n:'Cuisine',of:'판교 A',t:'general',ev:[{s:m(9,0),e:m(10,0),t:'주간 팀 미팅',by:'프로덕트팀'},{s:m(13,30),e:m(15,0),t:'로드맵 리뷰',by:'기획'},{s:m(19,0),e:m(20,0),t:'야간 운영 점검',by:'운영'}]},
    {n:'Savor',of:'판교 A',t:'general',ev:[{s:m(10,30),e:m(11,30),t:'디자인 싱크',by:'디자인팀'}]},
    {n:'Corkage',of:'판교 A',t:'general',ev:[{s:m(14,0),e:m(14,30),t:'1:1',by:'김리더'},{s:m(16,0),e:m(17,0),t:'스프린트 회고',by:'개발팀'}]},
    {n:'Dining',of:'판교 A',t:'general',ev:[{s:m(11,0),e:m(12,0),t:'제휴 미팅',by:'BD'}]},
    {n:'Pairing',of:'판교 A',t:'general',ev:[{s:m(9,30),e:m(10,30),t:'CS 주간',by:'운영'},{s:m(15,0),e:m(16,30),t:'채용 논의',by:'People'}]},
    {n:'Gourmet',of:'판교 A',t:'general',ev:[{s:m(13,0),e:m(14,0),t:'마케팅 캠페인',by:'마케팅'}]},
    {n:'Plating',of:'판교 A',t:'general',ev:[{s:m(10,0),e:m(11,0),t:'데이터 리뷰',by:'그로스'}]},
    {n:'Terrace',of:'판교 B',t:'general',ev:[{s:m(9,0),e:m(9,50),t:'모닝 스탠드업',by:'플랫폼'},{s:m(14,0),e:m(15,30),t:'아키텍처 논의',by:'개발'}]},
    {n:'Roasting',of:'판교 B',t:'general',ev:[{s:m(12,0),e:m(13,0),t:'점심 세미나',by:'전사'}]},
    {n:'Baking',of:'판교 B',t:'general',ev:[{s:m(16,0),e:m(18,0),t:'파트너 워크샵',by:'세일즈'},{s:m(21,0),e:m(22,30),t:'배포 대기 점검',by:'플랫폼'}]},
    {n:'Interview 1',of:'판교 B',t:'interview',ev:[{s:m(10,0),e:m(11,0),t:'면접 (경력)',by:'People'},{s:m(14,0),e:m(15,0),t:'면접 (신입)',by:'People'}]},
    {n:'Interview 2',of:'판교 B',t:'interview',ev:[{s:m(11,0),e:m(12,0),t:'면접 (디자인)',by:'People'}]},
    {n:'Party',of:'판교 B',t:'video',ev:[{s:m(13,0),e:m(14,30),t:'화상 전사 공유',by:'경영지원'},{s:m(19,0),e:m(21,0),t:'글로벌 화상 미팅',by:'BD'}]},
    {n:'Flavor',of:'페이',t:'general',ev:[{s:m(15,0),e:m(16,0),t:'페이 정기회의',by:'페이팀'}]}
  ];

  function pad(n){return('0'+n).slice(-2);}
  function fmt(mins){return pad(Math.floor(mins/60))+':'+pad(mins%60);}

  var REFS=[];   // 행별 참조 (상태 갱신용)
  function build(){
    var rows=document.getElementById('rows'), ta=document.getElementById('taxis');
    REFS=[];
    OFFICES.forEach(function(of){
      var hdr=document.createElement('div'); hdr.className='ohdr'; hdr.textContent=of;
      rows.appendChild(hdr);
      ROOMS.filter(function(r){return r.of===of;}).forEach(function(r){
        var row=document.createElement('div'); row.className='rrow';
        var tc=TYPEC[r.t]||TYPEC.general;
        var nm=document.createElement('div'); nm.className='rname';
        nm.innerHTML='<span class="dot"></span>'+r.n+'<span class="rstat"></span>';
        var tr=document.createElement('div'); tr.className='rtrack';
        var evRefs=[];
        (r.ev||[]).forEach(function(ev){
          var left=(ev.s-START*60)/TOTAL*100, w=(ev.e-ev.s)/TOTAL*100;
          var d=document.createElement('div'); d.className='ev'+((ev.e-ev.s)<45?' narrow':'');   // 45분 미만은 부제 숨김
          d.style.left=left+'%'; d.style.width='calc('+w+'% - 4px)';
          d.style.setProperty('--ec',tc.c); d.style.setProperty('--eb',tc.b);
          d.innerHTML='<div class="et">'+ev.t+'</div><div class="em">'+fmt(ev.s)+'–'+fmt(ev.e)+' · '+ev.by+'</div>';
          tr.appendChild(d); evRefs.push({el:d,ev:ev});
        });
        row.appendChild(nm); row.appendChild(tr); rows.appendChild(row);
        REFS.push({row:row,stat:nm.querySelector('.rstat'),ev:evRefs,track:tr});
      });
    });
    // 시간 라벨 (1시간 간격) + 그리드선은 트랙 배경에서
    for(var hh=START; hh<END; hh++){
      var lb=document.createElement('div'); lb.className='tl';
      lb.style.left=((hh-START)/(END-START)*100)+'%'; lb.textContent=pad(hh)+':00';
      ta.appendChild(lb);
    }
    // 지금 시각 오버레이
    var ov=document.createElement('div'); ov.className='nowoverlay'; ov.id='nowov';
    rows.appendChild(ov);
  }

  function nowLine(){
    var ov=document.getElementById('nowov'); if(!ov) return;
    ov.innerHTML='';
    var d=new Date(), cur=d.getHours()*60+d.getMinutes();
    if(cur<START*60||cur>END*60) return;
    var left=(cur-START*60)/TOTAL*100;
    var ln=document.createElement('div'); ln.className='nowvline'; ln.style.left=left+'%';
    ln.innerHTML='<span class="dot"></span><span class="tag">'+pad(d.getHours())+':'+pad(d.getMinutes())+'</span>';
    ov.appendChild(ln);
  }

  function refreshStatus(){
    var d=new Date(), cur=d.getHours()*60+d.getMinutes();
    REFS.forEach(function(rf){
      var busy=false, soonMin=Infinity;
      rf.ev.forEach(function(x){
        var s=x.ev.s, e=x.ev.e;
        x.el.classList.remove('past','now');
        if(s<=cur && cur<e){ busy=true; x.el.classList.add('now'); }
        else if(e<=cur){ x.el.classList.add('past'); }
        else if(s>cur){ soonMin=Math.min(soonMin, s-cur); }
      });
      var cls, label;
      if(busy){ cls='r-busy'; label='사용 중'; }
      else if(soonMin<15){ cls='r-soon'; label='곧 예정'; }   // 다음 회의 15분 이내(원래 로직과 동일)
      else { cls='r-free'; label='비어 있음'; }
      rf.row.classList.remove('r-busy','r-soon','r-free'); rf.row.classList.add(cls);
      rf.stat.textContent=label;
      renderFreeSlots(rf, cur);
    });
  }
  // 예약 가능(빈) 시간대를 초록 블록으로. 지금부터, 15분 이상 비는 구간만
  var MG=15;
  function renderFreeSlots(rf, cur){
    var tr=rf.track; if(!tr) return;
    tr.querySelectorAll('.slotfree').forEach(function(x){x.remove();});
    var base=Math.max(cur, START*60), endB=END*60;
    if(base>=endB) return;
    // 지금 이후 회의들만, 시작순 정렬
    var evs=rf.ev.map(function(x){return x.ev;}).filter(function(e){return e.e>base;}).sort(function(a,b){return a.s-b.s;});
    var p=base;
    var add=function(s,e){
      if(e-s<MG) return;
      var left=(s-START*60)/TOTAL*100, w=(e-s)/TOTAL*100;
      var d=document.createElement('div'); d.className='ev slotfree';
      d.style.left=left+'%'; d.style.width='calc('+w+'% - 4px)';
      d.innerHTML='<div class="et">예약 가능</div><div class="em">'+fmt(s)+'–'+fmt(e)+'</div>';
      if((e-s)<45) d.classList.add('narrow');
      tr.appendChild(d);
    };
    evs.forEach(function(e){ if(e.s>p) add(p, e.s); p=Math.max(p, e.e); });
    if(endB>p) add(p, endB);
  }

  function tick(){
    var d=new Date(), wd=['일','월','화','수','목','금','토'][d.getDay()];
    document.getElementById('date').textContent=d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' ('+wd+')';
    document.getElementById('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
    nowLine(); refreshStatus();
  }

  build(); tick(); setInterval(tick,30000);
</script>
</body>
</html>
