<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>회의실 디스플레이</title>
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
  *{margin:0;padding:0;box-sizing:border-box;}
  html.nocursor, html.nocursor *{cursor:none !important;}  /* 유휴 시 마우스 커서 숨김(키오스크) */
  html,body{width:100%;height:100%;overflow:hidden;font-family:"Pretendard",sans-serif;background:#FD3D00;-webkit-font-smoothing:antialiased;color:#1F2124;word-break:keep-all;}
  .fit-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#FD3D00;overflow:hidden;}   /* 상단 등 미세 여백을 브랜드 오렌지로 */
  .fit-wrap.dark{background:radial-gradient(1100px 520px at 50% -8%, rgba(253,61,0,0.18), rgba(253,61,0,0) 62%), #0C0D11;}
  .page{width:1920px;height:1080px;background:#fff;position:relative;display:flex;flex:none;overflow:hidden;transform-origin:center center;}
  .calframe{width:100%;height:100%;border:0;display:block;background:#14161b;}
  /* iframe은 replaced 요소라 inset:0로 안 늘어남 → div 래퍼(inset:0, 늘어남)로 감싸고 iframe은 그 100%를 채움. vh 안 써서 TV Bro 정상 */
  #__ifrvwrap{position:fixed;inset:0;background:#14161b;z-index:2147483000;overflow:hidden;}
  #__ifrv{display:block;width:100%;height:100%;border:0;background:#14161b;}
  /* 인터뷰 진행 중 커버: 검정 배경 + 주황 로고만 (인터뷰룸 예약 시간대에만 표시) */
  #iv-cover{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:9999;}
  #iv-cover .iv-logo{font-size:72px;font-weight:900;letter-spacing:8px;color:#FD3D00;}
  #iv-cover .iv-logo-img{width:46vw;max-width:640px;height:auto;display:block;}
  #iv-cover .iv-wrap{display:flex;flex-direction:column;align-items:center;}
  #iv-cover .iv-slogan{color:#FF3D00;font-weight:700;font-size:34px;letter-spacing:2px;margin-bottom:16px;}

  /* ===== 사이드바 (코랄) ===== */
  .side{width:460px;flex:0 0 460px;background:linear-gradient(155deg,#FF6A3A 0%,#FD3D00 100%);color:#fff;padding:44px 50px;display:flex;flex-direction:column;position:relative;z-index:2;box-shadow:8px 0 24px rgba(0,0,0,0.16);}
  /* 화상회의실 : 그라데이션 없이 단색 로고 오렌지 */
  .side.solid{background:#FD3D00;}
  /* 임원 회의실 : 흰 배경 + 어두운 글씨 */
  .side.light{background:#FFFFFF;color:#1F2124;box-shadow:8px 0 24px rgba(0,0,0,0.10);}
  .side.light .logo{color:#FD3D00;}
  .side.light .rtitle{color:#1F2124;}
  .side.light .hr{background:rgba(0,0,0,0.12);}
  .side.light .ask{color:#5A5F66;}
  .side.light .ask b{color:#1F2124;}
  .side.light .sched-head{color:#1F2124;}
  .side.light .sched-status{background:#F1F2F4;color:#FD3D00;}
  .side.light .sch-item{background:#F4F5F7;border-left-color:#CED2D8;}
  .side.light .sch-item .t{color:#1F2124;}
  .side.light .sch-item .n{color:#5A5F66;}
  .side.light .sch-empty{background:#F4F5F7;color:#8A9099;}
  .side.light .bubble{background:#fff;color:#FD3D00;border:2px solid #FD3D00;}
  .side.light .now-tag{color:#1F2124;}
  .logo{font-size:30px;font-weight:900;letter-spacing:3px;}
  .logo-img{height:44px;width:auto;display:block;}
  .rtitle{margin-top:28px;font-size:42px;line-height:1.12;font-weight:800;letter-spacing:-0.03em;}
  .hr{height:1px;background:rgba(255,255,255,0.28);margin:26px 0 22px;}
  .ask{font-size:18px;line-height:1.4;}
  .ask .op{opacity:0.78;} .ask .sep{opacity:0.4;margin:0 10px;} .ask b{font-weight:600;}
  .sched{margin-top:30px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .sched-head{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:13px;}
  .sched-status{font-size:13px;font-weight:800;padding:4px 12px;border-radius:14px;background:#fff;color:#FD3D00;display:inline-flex;align-items:center;}
  .sched-status .sdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;}
  .sched-status.s-free .sdot{background:#2FCB84;box-shadow:0 0 8px #2FCB84;}
  .sched-status.s-busy .sdot{background:#FF2D55;box-shadow:0 0 8px #FF2D55;}
  .sched-status.s-prep .sdot{background:#FF9500;box-shadow:0 0 8px #FF9500;}
  .sched-status.s-loading .sdot{background:#c0c4cc;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.15}}
  .now-tag .blink{color:#FF2D55;animation:blink 1.1s infinite;}
  .sch-item.now .t .blink{color:#FF2D55;animation:blink 1.1s infinite;margin-right:3px;}
  .sch-item.free,.sch-item.soon{background:#fff;border-left:4px solid #2FCB84;box-shadow:0 3px 12px rgba(0,0,0,0.16);}
  .sch-item.free .free-line,.sch-item.soon .soon-line{display:block;font-size:14px;font-weight:800;color:#14A05C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sch-item.free .free-line .blink,.sch-item.soon .soon-line .blink{color:#2FCB84;animation:blink 1.1s infinite;margin-right:2px;}
  .sched-list.two .sch-item.free .free-line,.sched-list.two .sch-item.soon .soon-line{font-size:12.5px;}
  .sched-list.dense .sch-item.free .free-line,.sched-list.dense .sch-item.soon .soon-line{font-size:11.5px;}
  .sched-list{display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-height:0;overflow:hidden;}
  .sched-list.two{display:block;column-count:2;column-gap:8px;}
  .sched-list.two .sch-item{break-inside:avoid;margin-bottom:5px;}
  .sched-list.dense .sch-item{padding:5px 10px;margin-bottom:4px;}
  .sched-list.dense .sch-item .t{font-size:12px;}
  .sched-list.dense .sch-item .n{font-size:11px;}
  .sched-list.dense .sch-item.now .now-tag{font-size:11px;margin-bottom:3px;}
  .sched-list.dense .sch-item.past{padding:2px 10px;}
  .sch-item{background:rgba(255,255,255,0.15);border-radius:11px;padding:10px 14px;border-left:4px solid rgba(255,255,255,0.65);}
  .sch-item .t{font-size:16px;font-weight:800;white-space:nowrap;}
  .sch-item .n{font-size:14.5px;opacity:0.92;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sch-item.hasjoin{display:flex;align-items:center;gap:10px;}
  .sch-item.hasjoin .sch-main{flex:1;min-width:0;}
  .sch-join{flex:none;background:rgba(255,255,255,0.18);color:#fff;text-decoration:none;font-size:14px;font-weight:800;padding:8px 17px;border-radius:9px;white-space:nowrap;border:1.5px solid rgba(255,255,255,0.8);}
  .sch-join:hover{background:#fff;color:#FD3D00;}
  .sch-item.now .sch-join{background:#fff;color:#FD3D00;border-color:#FD3D00;}
  .sch-item.now .sch-join:hover{background:#FD3D00;color:#fff;}
  .sch-item.now{background:#fff;border-left:4px solid #FF2D55;box-shadow:0 3px 12px rgba(0,0,0,0.16);}
  .sch-item.now .t{color:#FD3D00;}
  .sch-item.now .n{color:#D6321E;opacity:1;}
  .sch-item.now .now-tag{font-size:12px;font-weight:800;margin-bottom:5px;letter-spacing:0.02em;color:#FF2D55;}
  .side.light .sch-item.now{background:#FFE7E3;}
  .side.light .sch-item.now .t{color:#FD3D00;}
  .side.light .sch-item.now .n{color:#D6321E;}
  .sch-item.past{opacity:0.5;display:flex;align-items:baseline;flex-wrap:nowrap;gap:7px;padding:3px 12px;}
  .sch-item.past .t{font-size:12px;white-space:nowrap;flex:none;}
  .sch-item.past .n{font-size:11px;margin-top:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sch-empty{font-size:14px;opacity:0.85;background:rgba(255,255,255,0.1);border-radius:12px;padding:14px;text-align:center;}
  .side-bottom{margin-top:14px;padding-top:0;flex:none;display:flex;flex-direction:column;gap:16px;}
  .pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.32);padding:11px 20px;border-radius:999px;font-size:17px;font-weight:600;}
  .bubble{align-self:flex-start;background:#fff;color:#FD3D00;padding:17px 24px;border-radius:22px 22px 22px 6px;font-size:20px;font-weight:700;line-height:1.4;box-shadow:0 16px 32px rgba(0,0,0,0.22), 0 4px 12px rgba(0,0,0,0.14);}

  /* ===== 테스트룸 초안: 왼쪽 스케줄 확대 ===== */
  .side.schbig{width:560px;flex:0 0 560px;flex-basis:560px;padding:34px 44px;}
  /* 위쪽(로고·방이름·문의)은 컴팩트하게 → 스케줄에 세로 공간 몰아주기 */
  .side.schbig .logo-img{height:34px;}
  .side.schbig .rtitle{margin-top:16px;font-size:34px;}
  .side.schbig .hr{margin:16px 0 14px;}
  .side.schbig .ask{font-size:15px;}
  .side.schbig .sched{margin-top:20px;}
  .side.schbig .sched-head{font-size:26px;margin-bottom:16px;}
  .side.schbig .sched-status{font-size:15px;padding:5px 14px;}
  .side.schbig .sched-list{gap:7px;}
  .side.schbig .sch-item{padding:11px 18px;border-radius:13px;}
  .side.schbig .sch-item .t{font-size:21px;line-height:1.3;}
  .side.schbig .sch-item .n{font-size:17px;margin-top:5px;line-height:1.3;}
  .side.schbig .sch-item.past{padding:6px 18px;}   /* 끝난 회의는 한 줄이라 더 얇게 */
  .side.schbig .sch-item.past .n{margin-top:0;}
  /* 시안 B: 스케줄 패널 대폭 확대 (가이드는 오른쪽으로 밀려 좁아짐) */
  .side.schbig.schbigB{width:900px;flex:0 0 900px;flex-basis:900px;}
  .side.schbig.schbigB .sched-list{column-count:2;column-gap:14px;display:block;}
  .side.schbig.schbigB .sch-item{break-inside:avoid;margin-bottom:8px;}
  .side.schbig.schbigB .rtitle{font-size:40px;}
  /* 시안 C: 스케줄 최대(2열, 1100px) + 가이드는 오른쪽에 좁게 유지 */
  .side.schbig.schbigC{width:1100px;flex:0 0 1100px;flex-basis:1100px;}
  .side.schbig.schbigC .rtitle{font-size:44px;}
  .side.schbig.schbigC .sched-head{font-size:28px;}
  .side.schbig.schbigC .sched-list{column-count:2;column-gap:16px;display:block;}
  .side.schbig.schbigC .sch-item{break-inside:avoid;margin-bottom:9px;}
  .side.schbig.schbigC .sch-item .t{font-size:22px;}
  .side.schbig.schbigC .sch-item .n{font-size:18px;}
  .side.schbig .sch-item.free .free-line,.side.schbig .sch-item.soon .soon-line{font-size:17px;}
  .side.schbig .sch-item.past .t{font-size:15px;}
  .side.schbig .sch-item.past .n{font-size:13.5px;}
  /* ===== 시안 공통: 세로 스택(스케줄 존 + 가이드) ===== */
  .vcol{width:100%;height:100%;display:flex;flex-direction:column;}
  .vcol .main{flex:1 1 auto;min-height:0;}
  .szone{flex:0 0 auto;background:linear-gradient(120deg,#FF6A3A 0%,#FD3D00 100%);color:#fff;}
  .szone.szone-bot{background:linear-gradient(120deg,#FD3D00 0%,#FF6A3A 100%);}
  .szone-in{padding:26px 60px;}
  .dhd{display:flex;align-items:center;gap:20px;}
  .dhd-logo{height:30px;width:auto;}
  .dhd-rt{font-size:32px;font-weight:800;letter-spacing:-0.02em;flex:1;}
  .dhd-st{font-size:16px;padding:6px 16px;flex:none;}
  /* A: 가로 타임라인 */
  .tl{position:relative;height:150px;margin-top:26px;}
  .tl-track{position:absolute;inset:0;background:rgba(255,255,255,0.12);border-radius:16px;}
  .tl-tick{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,0.28);}
  .tl-tick span{position:absolute;bottom:-24px;left:-16px;font-size:13px;font-weight:700;color:rgba(255,255,255,0.85);}
  .tl-blk{position:absolute;top:18px;bottom:18px;background:#fff;color:#FD3D00;border-radius:11px;padding:9px 12px;overflow:hidden;box-shadow:0 5px 14px rgba(0,0,0,0.22);display:flex;flex-direction:column;justify-content:center;}
  .tl-blk.on{background:#FFE7E3;outline:3px solid #fff;}
  .tl-blk.past{opacity:0.5;}
  .tl-t{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tl-tm{font-size:12px;font-weight:700;opacity:0.85;margin-top:2px;}
  .tl-now{position:absolute;top:-8px;bottom:-8px;width:3px;background:#14161C;border-radius:2px;}
  .tl-now span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;background:#14161C;color:#fff;padding:2px 8px;border-radius:7px;white-space:nowrap;}
  /* B: Now / Next 카드 */
  .nn{display:flex;gap:22px;margin-top:22px;align-items:stretch;}
  .nn-now{flex:1.7;background:#fff;color:#1F2124;border-radius:20px;padding:26px 32px;box-shadow:0 12px 30px rgba(0,0,0,0.22);display:flex;flex-direction:column;justify-content:center;min-height:190px;}
  .nn-now .nn-lbl{font-size:17px;font-weight:800;color:#FF2D55;}
  .nn-now.free .nn-lbl{color:#14A05C;}
  .nn-now.fixedbz{background:#FFF6E9;}
  .nn-now .nn-lbl.fixedbz-lbl{color:#F59300;}
  .jline{display:block;font-size:0.8em;font-weight:600;color:#8A9099;margin-top:2px;line-height:1.25;}
  .koline{font-size:0.62em;font-weight:500;color:#AEB3BB;white-space:nowrap;letter-spacing:-0.3px;}
  .nn-now .nn-title{font-size:38px;font-weight:800;margin-top:10px;letter-spacing:-0.02em;}
  .nn-now .nn-time{font-size:21px;color:#5A5F66;margin-top:8px;font-weight:600;}
  .nn-now{flex-direction:row;align-items:stretch;gap:24px;}
  .nn-now .nn-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .nn-next{display:flex;flex-direction:row;align-items:stretch;gap:14px;}
  .nn-next .nn-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .nn-join{flex:0 0 auto;align-self:center;width:120px;height:120px;display:flex;align-items:center;justify-content:center;background:#FD3D00;color:#fff;text-decoration:none;font-size:20px;font-weight:800;border-radius:16px;box-shadow:0 6px 16px rgba(253,61,0,0.3);white-space:nowrap;padding:0;}
  .nn-join.sm{width:64px;height:64px;background:#fff;color:#FD3D00;font-size:13.5px;box-shadow:0 4px 10px rgba(0,0,0,0.15);}
  .nn-col{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0;}
  .nn-next{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.32);border-radius:16px;padding:18px 22px;}
  .nn-next .nn-lbl{font-size:14px;font-weight:800;opacity:0.9;}
  .nn-next .nn-title{font-size:23px;font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nn-next .nn-time{font-size:15px;opacity:0.9;margin-top:3px;}
  .nn-rest{flex:1;min-height:0;overflow:hidden;}
  .nn-rest-h{font-size:13px;font-weight:800;opacity:0.85;margin-bottom:7px;letter-spacing:0.03em;}
  .nn-ri{font-size:15px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.16);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nn-ri span{font-weight:800;margin-right:9px;}
  /* C: 하단 가로 스트립 */
  .strip{display:flex;gap:16px;margin-top:18px;overflow:hidden;}
  .stc{flex:0 0 300px;background:#fff;color:#1F2124;border-radius:16px;padding:18px 22px;box-shadow:0 8px 20px rgba(0,0,0,0.2);}
  .stc.on{background:#FFE7E3;outline:3px solid #fff;}
  .stc-tm{font-size:15px;font-weight:800;color:#FD3D00;}
  .stc-t{font-size:21px;font-weight:800;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stc-now{font-size:13px;font-weight:800;color:#FF2D55;margin-top:6px;}
  .stc.empty{flex:1;color:#fff;background:rgba(255,255,255,0.14);box-shadow:none;font-weight:700;display:flex;align-items:center;justify-content:center;}
  /* D: 출발안내판 보드 (오렌지) */
  .board{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
  .bd-row{display:flex;align-items:center;gap:24px;background:rgba(255,255,255,0.13);border-left:5px solid rgba(255,255,255,0.45);border-radius:11px;padding:14px 26px;}
  .bd-row.on{background:#fff;border-left-color:#fff;box-shadow:0 6px 16px rgba(0,0,0,0.18);}
  .bd-tm{flex:0 0 200px;font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:0.5px;}
  .bd-nm{flex:1;font-size:27px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bd-row.on .bd-tm,.bd-row.on .bd-nm{color:#FD3D00;}
  .bd-st{flex:0 0 auto;font-size:17px;font-weight:800;padding:7px 16px;border-radius:999px;}
  .bd-st.on{background:#FD3D00;color:#fff;}
  .bd-st.soon{background:rgba(255,255,255,0.22);color:#fff;}
  .bd-empty{justify-content:center;color:#fff;opacity:0.85;font-size:22px;}
  .bd-more{font-size:16px;font-weight:700;color:#fff;opacity:0.85;padding:4px 26px;}
  /* E: 카운트다운 히어로 */
  .szone.szone-hero .szone-in{padding-bottom:36px;}
  .cd{margin-top:20px;text-align:center;}
  .cd-lbl{font-size:22px;font-weight:800;opacity:0.95;}
  .cd-big{font-size:96px;font-weight:900;line-height:1.05;letter-spacing:-0.03em;margin-top:6px;}
  .cd-sub{font-size:20px;font-weight:600;opacity:0.9;margin-top:8px;}
  .cd.free .cd-big{font-size:80px;}
  /* F: 오전/오후 2분할 */
  .ampm{display:flex;gap:22px;margin-top:22px;}
  .ap-col{flex:1;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.2);border-radius:18px;padding:18px 22px;min-height:230px;}
  .ap-h{font-size:20px;font-weight:800;margin-bottom:12px;letter-spacing:0.04em;opacity:0.95;}
  .ap-i{display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.16);}
  .ap-i.on{background:rgba(255,255,255,0.14);border-radius:8px;padding:10px 12px;margin:0 -12px;}
  .ap-i.past{opacity:0.5;}
  .ap-tm{flex:0 0 128px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .ap-nm{flex:1;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ap-empty{opacity:0.7;font-size:16px;padding:12px 0;}
  /* G: 반원 데이-클락 */
  .clockwrap{width:100%;max-width:560px;height:250px;display:block;margin:8px auto 0;}
  .ck-track{stroke:rgba(255,255,255,0.16);stroke-width:26;stroke-linecap:round;}
  .ck-seg{stroke:#fff;stroke-width:26;stroke-linecap:round;}
  .ck-seg.on{stroke:#FFD9CF;}
  .ck-seg.past{stroke:rgba(255,255,255,0.4);}
  .ck-tk{fill:rgba(255,255,255,0.85);font-size:15px;font-weight:700;}
  .ck-now{stroke:#14161C;stroke-width:3.5;}
  .ck-nowdot{fill:#14161C;stroke:#fff;stroke-width:2;}
  .ck-c1{fill:#fff;font-size:16px;font-weight:800;}
  .ck-c2{fill:#fff;font-size:24px;font-weight:800;}
  /* ===== 시안 공통: 1080 프레임을 꽉 채우도록 균형 ===== */
  .vcol{overflow:hidden;}

  @keyframes vcJoined{0%,60%{opacity:0}68%,90%{opacity:1}96%,100%{opacity:0}}
  /* 연결 가이드 : HDMI(1) + 무선그룹(2, Mac|Win + 공용 말풍선 1개) */
  .conn3{display:grid;grid-template-columns:1fr 2fr;gap:22px;}
  .conn4{display:grid;grid-template-columns:1fr 1fr 2fr;gap:16px;}
  .wgroup{display:flex;flex-direction:column;gap:16px;min-width:0;}
  .wpair{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-width:0;}
  .wpair.one{grid-template-columns:1fr;}
  .wgroup > .tip{margin-top:0;}
  .conn4 .imgslot{height:185px;margin:14px 0 4px;}
  .conn4 .gcard{padding:20px;}
  .conn4 .gc-tt{font-size:17px;}
  .conn4 ol.steps{gap:9px;margin-top:12px;}
  .conn4 ol.steps li{font-size:14px;}
  .conn4 .mc-t{font-size:15px;}
  .conn4 .tip{font-size:13px;padding:11px 14px;}
  .qr{flex:0 0 380px;background:#fff;border:2px solid #E1E4E9;border-radius:22px;box-shadow:0 12px 28px rgba(0,0,0,0.17), 0 4px 10px rgba(0,0,0,0.10);padding:24px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .qr .qh{font-size:23px;font-weight:800;color:#1F2124;}
  .qr .qimg{width:190px;height:190px;background:#F1F2F4;border:2px dashed #D7DADF;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#9aa0a6;text-align:center;line-height:1.5;box-shadow:0 12px 28px rgba(0,0,0,0.17), 0 4px 10px rgba(0,0,0,0.10);}
  .qr .qs{font-size:14px;color:#8A9099;text-align:center;line-height:1.4;}
  .qr .qcred{width:100%;display:flex;flex-direction:column;gap:7px;align-items:center;}
  .qr .qcr{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:#1F2124;}
  .qr .ql{flex:none;min-width:38px;text-align:center;display:inline-block;font-size:12.5px;font-weight:800;color:#fff;background:#FD3D00;padding:3px 9px;border-radius:7px;}
  .etq-h{display:flex;align-items:center;gap:11px;margin-bottom:18px;}
  .etq-bar{width:7px;height:24px;border-radius:3px;background:#FD3D00;}
  .etq-h h3{margin:0;font-size:23px;font-weight:800;}
  .etq-h .s{font-size:16px;color:#8A9099;font-weight:500;}
  .etq-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  .etq-item{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .etq-circle{width:76px;height:76px;border-radius:50%;background:#FFECE9;display:flex;align-items:center;justify-content:center;font-size:34px;}
  .etq-item span{font-size:16px;font-weight:600;text-align:center;}
  .ulm{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:13px;}
  .ulm li{display:flex;gap:11px;align-items:flex-start;font-size:16px;line-height:1.5;}
  .ulm .dot{color:#FD3D00;font-weight:800;}
  .vc{background:#fff;border:1px solid #ECEDEF;border-radius:22px;padding:20px;display:flex;gap:24px;margin-top:16px;}
  .vc-r{flex:1;display:flex;flex-direction:column;justify-content:center;}

  /* ===== 그레이 테마 (?gray=1) — 라이트지만 밝기를 크게 낮춘 회색 톤(눈부심 최소) ===== */
  .theme-gray .main{background:#E7E8EA;}
  .theme-gray .gsection,
  .theme-gray .etq,
  .theme-gray .wifi-guide,
  .theme-gray .qr{background:#F1F2F4;border-color:#DDE0E5;}
  .theme-gray .gcard{background:#F7F8FA;border-color:#E3E5E9;}
  .theme-gray .szone .nn-now{background:#F7F8FA;}

  /* ===== 본문 다크 테마 (?theme=dark) — 주황 사이드바·스케줄·QR·기기목업은 그대로, 본문만 어둡게 ===== */
  .theme-dark .main{background:#14161C;color:#E7E9ED;}
  .theme-dark .main .gsection,
  .theme-dark .main .etq,
  .theme-dark .main .wifi-guide,
  .theme-dark .main .qr{background:#1E2129;border-color:#333844;}
  .theme-dark .main .gcard{background:#23272F;border-color:#333844;}
  .theme-dark .main .gc-tt,
  .theme-dark .main .wl-h,
  .theme-dark .main .etq-h h3,
  .theme-dark .main .etq-item span,
  .theme-dark .main .qr .qh,
  .theme-dark .main .qr .qcr,
  .theme-dark .main .wifi-guide .wg-c{color:#E7E9ED;}
  .theme-dark .main .etq-h .s,
  .theme-dark .main .qr .qs{color:#9AA0A6;}
  .theme-dark .main .gc-ic,
  .theme-dark .main .etq-circle{background:rgba(253,61,0,0.16);}
  /* 다크: 유선/무선 연결 아이콘(HDMI·Apple·Windows)은 어두운 색이라 안 보임 → 흰색으로 */
  .theme-dark .main .gc-ic svg{filter:brightness(0) invert(1);}
  .theme-dark .main .key{background:#2A2E38;border-color:#3A404C;color:#D6D9DF;}
  .theme-dark .main .topbubble .cb-top{background:#23272F;color:#D6D9DF;border-color:#333844;}
  .theme-dark .main .tip{background:rgba(253,61,0,0.10);border-color:rgba(253,61,0,0.30);color:#FFC3B0;}
  .theme-dark .main .vbanner{background:rgba(253,61,0,0.10);border-color:rgba(253,61,0,0.30);}
  .theme-dark .main .vbanner .vb-tx{color:#FFC3B0;}
  /* 다크모드에서 남는 밝은 카드 보정 */
  .theme-dark .main .wl-col.mac-warn{background:rgba(253,61,0,0.10);border-color:rgba(253,61,0,0.30);}
  .theme-dark .main .wl-note{color:#F0B3A3;}
  /* 상단 스케줄 존(.szone): 다크모드에선 오렌지 밴드 대신 다크+오렌지 글로우로 하단 가이드와 통일 */
  .theme-dark .szone{background:radial-gradient(900px 380px at 20% -25%, rgba(253,61,0,0.22), rgba(253,61,0,0) 62%), #14161C;}
  .theme-dark .szone.szone-bot{background:radial-gradient(900px 380px at 80% 120%, rgba(253,61,0,0.22), rgba(253,61,0,0) 62%), #14161C;}
  .theme-dark .szone .nn-now{background:#23272F;color:#E7E9ED;}
  .theme-dark .szone .nn-now .nn-title{color:#E7E9ED;}
  .theme-dark .szone .nn-now .nn-time{color:#9AA0A6;}
  .theme-dark .szone .nn-now.fixedbz{background:#2A2620;}
  .theme-dark .szone .nn-next{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.14);}
  .theme-dark .szone .nn-ri{border-bottom-color:rgba(255,255,255,0.12);}

  /* ===== 방 선택 (B 다크) ===== */
  .picker{position:relative;width:100%;height:100%;padding:40px 64px;color:#fff;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
  .pk-test{position:absolute;top:26px;left:50%;transform:translateX(-50%);z-index:5;display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.16);border-radius:999px;padding:5px 8px;}
  .pk-test .pk-test-lbl{font-size:13px;font-weight:700;color:#8b8f9c;padding:0 6px;}
  .pk-test a{font-size:13px;font-weight:800;color:#cfd3db;text-decoration:none;padding:5px 13px;border-radius:999px;transition:background .15s ease,color .15s ease;}
  .pk-test a:hover{background:#FD3D00;color:#fff;}
  .pk-brand{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:800;letter-spacing:2.5px;color:#FD3D00;}
  .pk-brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#FD3D00,#D63400);box-shadow:0 0 12px rgba(253,61,0,0.9);}
  .pk-title{font-size:34px;font-weight:800;letter-spacing:-1.5px;margin-top:8px;color:#F7F8FA;}
  .pk-sub{font-size:14px;color:#8b8f9c;margin-top:6px;font-weight:500;}
  /* ── 실시간 현황 보드 ── */
  .picker.board .pk-top{display:flex;align-items:center;justify-content:space-between;}
  .picker.board .pk-logo{height:34px;width:auto;display:block;}
  .picker.board .pk-topr{display:flex;align-items:center;gap:20px;}
  .picker.board .pk-dt{text-align:right;line-height:1.05;}
  .picker.board .pk-date{font-size:19px;font-weight:700;color:#aab0bc;margin-bottom:5px;}
  .pk-rot{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#cfd3db;width:54px;height:54px;border-radius:14px;font-size:28px;cursor:pointer;line-height:1;flex:none;}
  .pk-rot:hover{background:#FD3D00;color:#fff;border-color:#FD3D00;}
  /* 세로 모드: 섹터 박스 2개를 위아래로 쌓음. 각 박스 안은 세로 나열 */
  .page.portrait .picker.board .pk-cols{flex-direction:column;gap:22px;flex:0 0 auto;}
  .page.portrait .picker.board .pk-sector{flex-direction:column;width:100%;gap:20px;padding:18px;}
  .page.portrait .picker.board .pgrp{flex:none !important;width:100%;}
  /* 세로에선 자동맞춤 끄고 자연 높이(1920 세로라 공간 충분) */
  .page.portrait .picker.board .pgrid{grid-auto-rows:auto !important;flex:0 0 auto !important;}
  .page.portrait .picker.board .cwrap{height:auto;}
  .page.portrait .picker.board .cwrap .pbtn{height:auto;min-height:150px;flex:0 0 auto;}
  .page.portrait .picker.board .pg-a .pgrid,
  .page.portrait .picker.board .pg-b .pgrid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .page.portrait .picker.board .pgrp-stack{flex:none !important;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
  .page.portrait .picker.board .pgrp-stack > .pgrp{width:auto;}   /* 페이=1열, 부산=2열 (3열 그리드) */
  .picker.board .pk-clock{font-size:34px;font-weight:800;color:#F7F8FA;font-variant-numeric:tabular-nums;letter-spacing:1px;}
  .picker.board .pk-headrow{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:24px;}
  .picker.board .pk-title{margin-top:0;}
  .picker.board .pk-summary{display:flex;gap:24px;font-size:18px;font-weight:800;white-space:nowrap;}
  .picker.board .pk-summary .sm{display:inline-flex;align-items:center;}
  .picker.board .pk-summary .sm-free{color:#2FCB84;}
  .picker.board .pk-summary .sm-busy{color:#FF6B7D;}
  .picker.board .pk-summary .sm-prep{color:#FFB259;}
  /* 카드 상태색 강조 (좌측 바 + 살짝 배경 틴트) */
  .pbtn.st-free::before{background:#2FCB84;opacity:1;}
  .pbtn.st-busy::before{background:#FF2D55;opacity:1;}
  .pbtn.st-prep::before{background:#FF9500;opacity:1;}
  .pbtn.st-busy{background:rgba(255,45,85,0.08);border-color:rgba(255,45,85,0.28);}
  /* 사용 가능: 아주 가벼운 테두리 밝기 펄스(그림자 애니 대신 → 렉 최소화) */
  @keyframes freeGlow{0%,100%{border-color:rgba(47,203,132,0.40);}50%{border-color:rgba(47,203,132,0.95);}}
  .pbtn.st-free{background:rgba(47,203,132,0.10);border-color:rgba(47,203,132,0.4);animation:freeGlow 3.4s ease-in-out infinite;}
  /* 보드 카드 3줄: 이름 / 현재상태 / 사용가능시간 / 회의이름 — 전부 한 줄(줄나눔 없음) */
  .picker.board .pbtn .rn{font-size:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;display:block;}
  .picker.board .pbtn .pk-state{font-size:20px;margin-top:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:#8b8f9c;}
  .picker.board .pbtn .pk-state.free{color:#2FCB84;} .picker.board .pbtn .pk-state.busy{color:#FF6B7D;} .picker.board .pbtn .pk-state.prep{color:#FFB259;}
  /* 화면 생존 표시(우하단): 점 + 텍스트. 초록=연결·지속시간, 빨강=끊김·마지막시각, 회색=신호없음 */
  .picker.board .pbtn .pk-alive{position:absolute;bottom:11px;right:14px;z-index:3;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:-0.2px;color:#7c828c;pointer-events:none;white-space:nowrap;}
  .picker.board .pbtn .pk-alive .dot{width:9px;height:9px;border-radius:50%;background:#3a3f48;flex:none;transition:background .3s;}
  .picker.board .pbtn .pk-alive.on{color:#6fbf95;} .picker.board .pbtn .pk-alive.on .dot{background:#2FCB84;box-shadow:0 0 6px rgba(47,203,132,.85);}
  .picker.board .pbtn .pk-alive.off{color:#e08b86;} .picker.board .pbtn .pk-alive.off .dot{background:#FF453A;box-shadow:0 0 7px rgba(255,69,58,.9);}
  .picker.board .pbtn .pk-slot{font-size:16px;margin-top:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:#aab0bc;}
  .picker.board .pbtn .pk-meet{font-size:15px;margin-top:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.3;color:#6b7079;}   /* 회의명 1줄+말줄임 */
  .picker.board .pbtn .pk-meet.has-meet{color:#f0b090;}
  .picker.board .pbtn-open:focus,.picker.board .pbtn:focus,.picker.board a:focus{outline:none;}   /* TV 브라우저 노란 포커스 테두리 제거 */
  .picker.board .pgrp h3{font-size:16px;}
  .picker.board .pk-summary{font-size:21px;}
  .picker.board .pk-title{font-size:38px;}
  .picker.board .pk-clock{font-size:38px;}
  /* 2개 섹터 박스: [판교 A(+쪽방)] | [판교 B+페이+부산]. 카드는 칸 높이에 맞춰 자동(넘침 방지) */
  .picker.board .pk-cols{display:flex;gap:30px;align-items:stretch;margin-top:22px;flex:1 1 auto;min-height:0;}
  .picker.board .pk-sector{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:20px;background:rgba(255,255,255,0.028);border:1px solid rgba(255,255,255,0.10);border-radius:18px;padding:24px;}
  .picker.board .pgrp{margin:0;min-width:0;flex:1 1 0;display:flex;flex-direction:column;min-height:0;}
  .picker.board .pgrp h3{flex:0 0 auto;}
  .picker.board .pgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start;flex:0 0 auto;}
  .picker.board .pbtn{justify-content:center;box-sizing:border-box;height:140px;overflow:hidden;}   /* 전 카드 동일 크기(가로·세로 통일) */
  .picker.board .cwrap{display:flex;flex-direction:column;gap:8px;align-self:start;min-width:0;}
  .picker.board .clabel{flex:0 0 auto;height:22px;line-height:22px;font-size:15px;font-weight:800;color:#FD3D00;letter-spacing:0.5px;padding-left:2px;}
  /* 왼쪽=판교A 3열, 오른쪽=판교B 3열 + 그 아래 페이(파티룸 밑) */
  .picker.board .pg-a .pgrid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .picker.board .pg-b .pgrid{grid-template-columns:repeat(3,minmax(0,1fr));}
  /* 판교B 안 작은 '페이' 영역 */
  .picker.board .paygrp{border:1px dashed rgba(253,61,0,0.45);background:rgba(253,61,0,0.05);border-radius:14px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px;}
  .picker.board .pay-h{font-size:15px;font-weight:800;color:#FD3D00;letter-spacing:1px;padding-left:2px;}
  .picker.board .paygrp .pbtn{padding:20px 24px;}
  .picker.board .pbtn{padding:14px 22px;}
  .picker.board .pbtn .pk-st{word-break:keep-all;line-height:1.5;}   /* 줄바꿈: 한글 단어 안 쪼개짐 */
  .picker.board .pgrp h3{margin-bottom:12px;}
  .picker.board .pbtn .rt{display:none;}          /* 태그(일반 회의실 등) 숨김 — 상태에 집중 */
  .picker.board .pbtn-book{font-size:11px;font-weight:600;padding:2px 8px;top:8px;right:8px;border-radius:6px;}
  .pgrp{margin-top:18px;}
  .pgrp h3{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:#FD3D00;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px;}
  .pgrp h3 .cnt{font-size:12px;font-weight:700;color:#aeb3bf;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);padding:2px 10px;border-radius:20px;letter-spacing:0;text-transform:none;}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
  .pbtn{position:relative;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px 18px;text-decoration:none;display:flex;flex-direction:column;gap:5px;transition:transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;overflow:hidden;}
  .pbtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc);opacity:0.9;}
  .pbtn:hover{transform:translateY(-3px);background:rgba(255,255,255,0.09);border-color:var(--tc);box-shadow:0 12px 28px rgba(0,0,0,0.45);}
  .pbtn .rn{font-size:20px;font-weight:700;color:#F5F6F8;letter-spacing:-0.5px;}
  .pbtn .rt{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#aab0bc;}
  .pbtn .rt .tdot{width:7px;height:7px;border-radius:50%;background:var(--tc);box-shadow:0 0 8px var(--tc);}
  .pbtn .pk-st{font-size:12.5px;font-weight:700;margin-top:7px;display:flex;align-items:flex-start;gap:6px;color:#8b8f9c;line-height:1.45;word-break:keep-all;}
  .pbtn .pk-st::before{content:"";width:7px;height:7px;border-radius:50%;background:#6b7078;display:inline-block;flex:none;margin-top:4px;}
  .pbtn .pk-mt{margin-top:4px;padding-left:13px;font-size:12px;font-weight:600;color:#FF9FAB;line-height:1.4;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pbtn .pk-st.free{color:#2FCB84;}
  .pbtn .pk-st.free::before{background:#2FCB84;box-shadow:0 0 8px #2FCB84;}
  .pbtn .pk-st.busy{color:#FF7A8C;}
  .pbtn .pk-st.busy::before{background:#FF2D55;box-shadow:0 0 8px rgba(255,45,85,0.7);}
  .pbtn .pk-st.prep{color:#FFB259;}
  .pbtn .pk-st.prep::before{background:#FF9500;box-shadow:0 0 8px rgba(255,149,0,0.7);}
  .pbtn .arr{position:absolute;right:16px;bottom:14px;color:var(--tc);opacity:0;transform:translateX(-4px);transition:all .18s ease;font-size:15px;font-weight:800;}
  .pbtn:hover .arr{opacity:1;transform:translateX(0);}
  .pbtn-open{display:flex;flex-direction:column;gap:5px;text-decoration:none;color:inherit;}
  .pbtn-open::after{content:"";position:absolute;inset:0;z-index:1;}
  .pbtn-book{position:absolute;top:12px;right:12px;z-index:2;font-size:12px;font-weight:500;color:#F5F6F8;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.22);border-radius:8px;padding:6px 11px;cursor:pointer;transition:background .15s ease,border-color .15s ease;}
  .pbtn-book:hover{background:rgba(255,255,255,0.18);border-color:var(--tc);}
  /* ── 1080p→4K 업스케일 대비: 글자 굵게·테두리 두껍게 (크기 유지, 선명도↑) ── */
  html,body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .gcard{border-width:2px;}
  .card p,.os-tx,.conn p{font-weight:600;}
  ol.steps li{font-weight:500;}
  .tip{font-weight:600;}
  .ulm li{font-weight:500;}

// ===== heartbeat(생존신호): 이 화면이 살아있음을 60초마다 GAS에 알림 → 현황판이 각 화면 생존 표시 =====
function pingBeat(k){ if(!CONFIG.appsScriptUrl||!k) return; try{ new Image().src=CONFIG.appsScriptUrl+'?ping='+encodeURIComponent(k)+'&t='+Date.now(); }catch(e){} }
function startHeartbeat(k){
  if(window.__hbTimer){ clearInterval(window.__hbTimer); window.__hbTimer=null; }
  if(!k) return;
  window.__hbKey=k; pingBeat(k);
  window.__hbTimer=setInterval(function(){ pingBeat(window.__hbKey); }, 60000);
}

// 현황판이 계산한 각 방의 "사용 가능 시작/끝" 저장 → 예약 시 안내된 시각 그대로 사용
const PICK_SLOT={};
// '예약' 클릭 → 그 회의실이 초대된 구글 캘린더 예약창을 본인 계정으로 새 탭에 염 (안내된 시각부터 기본 1시간)
function bookRoom(cal,name,key){
  const q=15*60000;
  const slot=PICK_SLOT[key];
  let s=(slot&&slot.start)?slot.start:Math.floor(Date.now()/q)*q;
  let e=s+60*60000; // 기본 1시간
  if(slot&&slot.end&&e>slot.end) e=slot.end; // 다음 예약 전까지로 제한
  const f=(ms)=>{const d=new Date(ms),p=n=>('0'+n).slice(-2);return ''+d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+p(d.getUTCHours())+p(d.getUTCMinutes())+'00Z';};
  const url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(name)+'&add='+encodeURIComponent(cal)+'&dates='+f(s)+'/'+f(e);
  const w=Math.min(960,screen.width-60),hgt=Math.min(780,screen.height-80),left=Math.max(0,Math.round((screen.width-w)/2)),top=Math.max(0,Math.round((screen.height-hgt)/2));
  const win=window.open(url,'roombook','width='+w+',height='+hgt+',left='+left+',top='+top);
  if(win){try{win.opener=null;win.focus();}catch(e){}}
}

// 회의실 선택화면: 각 방의 "지금" 사용 가능 여부 계산 (renderSched와 동일 규칙)
function pickAvail(events){
  events=events||[];
  const now=Date.now();
  const MG=5*60000;   // '곧 시작' 기준: 다음 회의 5분 이내
  const _eod=new Date();_eod.setHours(23,59,59,0);const eod=_eod.getTime();
  const sorted=events.slice().sort((a,b)=>a.start-b.start);
  const _cur=events.find(e=>now>=e.start&&now<e.end);       // 지금 진행 중인 회의
  const title=_cur?(_cur.title||''):'';
  const busy=!!_cur;
  const nx=sorted.filter(e=>e.start>now);
  const nextStart=nx.length?nx[0].start:eod;
  const availableNow=!busy && (nx.length===0 || (nextStart-now)>=MG); // 예정 회의 없거나 다음까지 15분 이상이면 사용 가능
  if(availableNow){
    const sR=Math.floor(now/MG)*MG;
    const slotTxt = (!nx.length) ? '이후 예정 없음' : ('~'+fmt(nextStart)+' 사용 가능');
    return {cls:'free',state:'사용 가능',slotTxt:slotTxt,startMs:sR,endMs:nx.length?nextStart:null,title:''};
  }
  // 사용 중 / 곧 회의 시작 → 다음 사용 가능 시각(15분 이상 비는 첫 시점, 연속회의 감안)
  let cursor=now, changed=true;
  while(changed){ changed=false;
    for(let i=0;i<sorted.length;i++){ const e=sorted[i]; if(e.end>cursor && e.start<=cursor+MG){ cursor=e.end; changed=true; } }
  }
  const state=busy?'사용 중':'곧 시작';
  const cls=busy?'busy':'prep';
  const showTitle = busy ? title : (nx.length ? (nx[0].title||'') : '');   // 곧 시작이면 다가오는 회의명 표시
  if(cursor>=eod) return {cls:cls,state:state,slotTxt:'오늘 종일 사용',startMs:null,endMs:null,title:showTitle};
  const after=sorted.filter(e=>e.start>cursor);
  const slotTxt = after.length ? (fmt(cursor)+'~'+fmt(after[0].start)+' 가능') : (fmt(cursor)+' 이후 가능');
  return {cls:cls,state:state,slotTxt:slotTxt,startMs:cursor,endMs:after.length?after[0].start:null,title:showTitle};
}

// 생존 표시: 마지막 신호가 ALIVE_MS(3분) 이내면 초록(+지속시간), 지나면 빨강(+마지막 연결시각), 신호없으면 회색
var ALIVE_MS=3*60000;
function applyAlive(hb, serverNow){
  var now = serverNow || Date.now();
  Object.keys(ROOMS).forEach(function(k){
    if(k.indexOf('test')===0) return;
    var wrap=document.getElementById('pk-alive-'+k); if(!wrap) return;
    var tx=wrap.querySelector('.pa-tx');
    var rec = hb && hb[k];
    wrap.classList.remove('on','off');
    if(!rec || !rec.last){ if(tx) tx.textContent=''; wrap.title='생존신호 없음(아직 미수신)'; return; }  // 회색
    if(now - rec.last <= ALIVE_MS){
      wrap.classList.add('on');
      var up = (rec.since && rec.since<=rec.last) ? (now-rec.since) : (now-rec.last);
      if(tx) tx.textContent=aliveAgo(up)+' 지속';
      wrap.title='연결됨 · '+aliveAgo(up)+' 연속 유지';
    } else {
      wrap.classList.add('off');
      if(tx) tx.textContent='마지막 '+aliveClock(rec.last);
      wrap.title='끊김 · 마지막 연결 '+aliveClock(rec.last)+' ('+aliveAgo(now-rec.last)+' 전)';
    }
  });
}
function aliveAgo(ms){ var s=Math.floor(ms/1000); if(s<60) return s+'초'; var m=Math.floor(s/60); if(m<60) return m+'분'; var h=Math.floor(m/60); if(h<24) return h+'시간'; return Math.floor(h/24)+'일'; }
function aliveClock(ts){ var d=new Date(ts), n=new Date();
  var hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  var sameDay=(d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate());
  return sameDay?hm:((d.getMonth()+1)+'/'+d.getDate()+' '+hm);
}

function renderSched(events,mode){
  events=events||[];
  const loading=(mode==='loading');
  const stEl=document.getElementById('schStatus');
  const now=Date.now();const busy=events.some(e=>now>=e.start&&now<e.end);
  const MINGAP=15*60000; // 구글 캘린더 15분 단위 → 15분 미만 빈틈은 사용 불가
  const _eod=new Date();_eod.setHours(23,59,59,0);const eodMs=_eod.getTime();
  const _next=events.filter(e=>e.start>now).sort((a,b)=>a.start-b.start);
  const nextStart=_next.length?_next[0].start:eodMs;
  const availableNow=!busy && (_next.length===0 || (nextStart-now)>=MINGAP); // 예정 회의가 없거나, 다음 회의까지 15분 이상이면 사용 가능
  if(stEl){
    let cls,label;
    if(loading){cls='s-loading';label='확인 중';}
    else if(busy){cls='s-busy';label='사용 중';}
    else if(availableNow){cls='s-free';label='사용 가능';}
    else {cls='s-prep';label='다음 회의 준비중';} // 회의 중은 아니나 다음 회의까지 15분 미만
    stEl.className='sched-status '+cls;
    stEl.innerHTML='<span class="sdot"></span>'+label;
  }
  // 인터뷰룸: 지금 진행 중인 예약의 제목에 인터뷰 키워드가 있을 때만 검정 커버 (일반 회의는 가이드 유지)
  const _cur=events.find(e=>now>=e.start&&now<e.end);
  const _isIv=!!(_cur && (_cur.iv || /인터뷰|면접|interview/i.test(_cur.title||''))); // careers@ 예약(iv) 또는 제목 키워드
  window.__coverBase=(window.__coverAlways || (window.__ivRoom && _isIv)); refreshCover();
  // 시안(테스트룸) 형태별 분기 — 세로 리스트 대신 다른 형태로 렌더
  if(window.__draft){ renderNN(events,now); return; }  // 확정 시안 B(Now/Next)
  const listEl=document.getElementById('schList'); if(!listEl)return;
  if(loading && !events.length){listEl.className='sched-list';listEl.innerHTML=`<div class="sch-empty">일정을 불러오는 중…</div>`;return;}
  // 지금 비어있으면 "사용 가능" 슬롯을 타임라인에 카드로 끼워넣기 (진행중 카드와 동일 뷰)
  let items=events.slice();
  if(!loading){
    // 지금~하루 끝까지의 모든 빈 시간대(gap, 15분 이상)를 "예약 가능" 카드로 채움
    const fut=events.filter(e=>e.end>now).sort((a,b)=>a.start-b.start);
    let cursor=now;
    fut.forEach(e=>{
      if(e.start-cursor>=MINGAP){ items.push({__slot:true,active:(cursor<=now+1000),start:cursor,end:e.start,hasNext:true}); }
      cursor=Math.max(cursor,e.end);
    });
    if(eodMs-cursor>=MINGAP){ items.push({__slot:true,active:(cursor<=now+1000),start:cursor,end:eodMs,hasNext:false}); }
  }
  if(!items.length){listEl.className='sched-list';listEl.innerHTML=`<div class="sch-empty">오늘 예약이 없습니다</div>`;return;}
  const itemsHtml=items.sort((a,b)=>a.start-b.start).map(e=>{
    if(e.__slot){
      if(e.active){
        const q=15*60000; let sR=Math.floor(now/q)*q; // 지금 속한 15분 블록의 시작(이미 비어있으므로)

      return `<div class="sch-item soon"><span class="soon-line"><span class="blink">●</span> 예약 가능 <b>${tt}</b></span></div>`;
    }

    return `<div class="${cls}"><div class="sch-main"><div class="t">${tLine}</div><div class="n">${evTitle(e)}</div></div>${jb}</div>`;
  }).join("");
  // 자동 맞춤: 1열로 그려보고, 세로/가로로 넘치면 2열 → 그래도 넘치면 촘촘 모드

function fit(){
  const page=document.getElementById('page');
  if(window.__iframeView){ page.style.transform='none'; return; }   // 캘린더/문패 iframe은 스케일 안 함(확대 버그 방지)
  // 화면 비율에 따라 자동 판별(기본 auto):
  //  · 거의 16:9(회의실 TV 풀스크린) → 덮어서(cover) 꽉 채움. 회색 여백 0, 잘림 0.
  //  · 비율이 많이 어긋난 화면(PC 브라우저 창 등) → 여백 방식(contain)으로 빠져 너무 커지지 않음.
  // 강제하려면 URL에 ?fit=cover(항상 꽉) / ?fit=contain(항상 여백) 을 붙이면 됨.
  const mode=(getParam('fit')||'auto').toLowerCase();
  const a=window.__rotAngle||0;
  const pw=parseFloat(page.style.width)||1920, ph=parseFloat(page.style.height)||1080;
  const swap=(a===90||a===270);           // 회전 후 경계 크기(가로·세로 스왑)
  const bw=swap?ph:pw, bh=swap?pw:ph;
  const rw=window.innerWidth/bw, rh=window.innerHeight/bh;
  const cover=Math.max(rw,rh), contain=Math.min(rw,rh);
  let base;
  if(mode==='cover') base=cover;
  else if(mode==='contain') base=contain;
  else base=(cover/contain-1 <= 0.06) ? cover : contain; // 잘림 6% 이내면 꽉, 넘으면 여백
  // 미세조정용(선택): ?safe=0.95 처럼 붙이면 그만큼 안쪽으로 줄여줌. 기본 1.
  let safe=parseFloat(getParam('safe'));
  if(!(safe>0.5 && safe<=1)) safe=1;
  // 채움(cover) 상태일 때만 아주 살짝 오버스캔 → 상하좌우 미세 여백 + 픽셀시프트 슬라이버 제거
  // ?bleed=0 붙이면 끔, ?bleed=1.01 처럼 값 조정 가능. 기본 1.006(약 0.6%)
  let bleed=parseFloat(getParam('bleed'));
  if(!(bleed>=1 && bleed<=1.05)){ bleed=(base===cover)?1.006:1; }
  // transform 스케일 (GPU 가속, 샤오미 등 정품 크로미움에서 선명)
  const s=base*safe*bleed;
  const rot=a?('rotate('+a+'deg) '):'';
  page.style.transform='translate('+__shift[0]+'px,'+__shift[1]+'px) '+rot+'scale('+s+')';
}
// 잔상 방지용 초미세 픽셀 시프트: 75초마다 화면 전체를 최대 3px, 2.5초에 걸쳐 천천히 이동(눈엔 거의 안 보임)
let __shift=[0,0];
function startPixelShift(){
  const page=document.getElementById('page'); if(!page) return;
  page.style.transition='transform 2.5s ease';            // '이동'만 부드럽게 (스케일은 최초 1회라 영향 없음)
  // 확인용: URL에 ?shiftpx=40&shiftsec=2 처럼 붙이면 크게·자주 움직여 눈으로 볼 수 있음. 기본 3px / 75초.
  let amp=parseInt(getParam('shiftpx'),10); if(!(amp>0)) amp=3;
  let sec=parseFloat(getParam('shiftsec')); if(!(sec>0)) sec=75;
  const pts=[[0,0],[1,0],[1,1],[0,1],[0.66,0.33],[0.33,0.66],[1,0.33],[0,0.66]];
  const seq=pts.map(p=>[Math.round(p[0]*amp),Math.round(p[1]*amp)]);
  let i=0;
  setInterval(function(){ i=(i+1)%seq.length; __shift=seq[i]; fit(); }, sec*1000);
}
// 야간(23:30~07:30)엔 모든 화면을 검정+로고 커버로. (?night=1 강제ON / ?night=0 강제OFF — 확인용)
// 야간 23:00~07:50 (?night=1/0 확인용)
function isNight(){
  const f=getParam('night'); if(f==='1')return true; if(f==='0')return false;
  const d=new Date(); const m=d.getHours()*60+d.getMinutes();
  return m>=(23*60) || m<(7*60+50);
}
// 점심 12:00~12:50 (?lunch=1/0)
function isLunch(){
  const f=getParam('lunch'); if(f==='1')return true; if(f==='0')return false;
  const d=new Date(); const m=d.getHours()*60+d.getMinutes();
  return m>=(12*60) && m<(12*60+50);
}
// 주말 토·일 19:00~09:50 (?weekend=1/0)
function isWeekend(){
  const f=getParam('weekend'); if(f==='1')return true; if(f==='0')return false;
  const d=new Date(); const g=d.getDay(); if(!(g===0||g===6)) return false;
  const m=d.getHours()*60+d.getMinutes();
  return m>=(19*60) || m<(9*60+50);
}

  const src=pay?'logo_pay_cover.png':'logo_cover.png';  // 커버는 오렌지 버전 (사이드바는 흰색 logo_pay.png)
  const img=document.createElement('img');
  img.className='iv-logo-img'; img.src=src; img.alt=txt;
  img.onerror=function(){ this.outerHTML='<div class="iv-logo">'+txt+'</div>'; };
  cov.innerHTML=''; cov.appendChild(img);
}
// ===== [행사/공지] 지정 기간, 전 회의실 가이드 대신 이미지 1장 전면 노출 =====
//  · img : 리포지토리에 올릴 이미지 파일명(또는 전체 URL)
//  · start/end : 한국시간(TV 로컬시간). 이 구간에만 이미지가 뜸.
//  · fit : 'cover'(꽉 채움, 넘치면 잘림) / 'contain'(안 잘리게 맞춤, 여백 생김)
//  · 미리보기/강제: 주소에 ?event=1(강제 ON) / ?event=0(강제 OFF)
const EVENT_TAKEOVER = { on:true, img:'event.png', fit:'contain', bg:'#000',
                         start:'2026-09-04T08:00:00', end:'2026-09-04T23:00:00' };
function isEventTakeover(){
  const f=getParam('event'); if(f==='1')return true; if(f==='0')return false;
  if(!EVENT_TAKEOVER.on) return false;
  const now=Date.now();
  const s=new Date(EVENT_TAKEOVER.start).getTime(), e=new Date(EVENT_TAKEOVER.end).getTime();
  return !isNaN(s) && !isNaN(e) && now>=s && now<e;
}
// 이미지 네 모서리 픽셀 평균색 → 여백(레터박스) 배경으로 (검정 대신 이미지 배경색과 이어지게)
function pickEventBg(img){
  try{
    const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
    const ctx=c.getContext('2d'); ctx.drawImage(img,0,0);
    const W=c.width,H=c.height, pts=[[1,1],[W-2,1],[1,H-2],[W-2,H-2]];
    let r=0,g=0,b=0,n=0;
    pts.forEach(function(p){ const d=ctx.getImageData(p[0],p[1],1,1).data; r+=d[0];g+=d[1];b+=d[2];n++; });
    if(n){ const el=document.getElementById('event-cover');
      if(el) el.style.background='rgb('+Math.round(r/n)+','+Math.round(g/n)+','+Math.round(b/n)+')'; }
  }catch(e){}   // 크로스오리진 등으로 못 읽으면 기본 bg 유지
}
function refreshEventCover(){
  let el=document.getElementById('event-cover');
  const active = !window.__isPicker && isEventTakeover();   // 회의실 화면에서만(현황판 제외)
  if(active){
    if(!el){ el=document.createElement('div'); el.id='event-cover';
      el.style.cssText='position:fixed;inset:0;z-index:2147482000;display:flex;align-items:center;justify-content:center;background:'+(EVENT_TAKEOVER.bg||'#000')+';';
      const img=document.createElement('img'); img.id='event-cover-img';
      img.onload=function(){ pickEventBg(img); };   // 로드되면 여백색 자동 감지
      el.appendChild(img); document.body.appendChild(el);
    }
    const img=document.getElementById('event-cover-img');
    if(img.getAttribute('src')!==EVENT_TAKEOVER.img) img.src=EVENT_TAKEOVER.img;
    img.style.cssText='width:100%;height:100%;object-fit:'+(EVENT_TAKEOVER.fit||'contain')+';display:block;';
    el.style.display='flex';
  } else if(el){ el.style.display='none'; }
}
// 테마 적용: 클래스 + 페이지 배경 + 헤더 로고색(화이트/그레이=흰 로고, 다크=오렌지 워드마크)
function setThemeMode(mode){
  const page=document.getElementById('page'); if(!page) return;
  page.classList.toggle('theme-dark', mode==='dark');
  page.classList.toggle('theme-gray', mode==='gray');
  page.style.background = (mode==='dark') ? '#14161C' : (mode==='gray') ? '#C6C8CC' : '#fff';
  const logo=page.querySelector('.dhd-logo');
  if(logo){
    if(mode==='dark'){ logo.src = window.__isPay ? LOGO_PAY_ORANGE_MARK : LOGO_ORANGE_MARK; }
    else { logo.src = window.__isPay ? 'logo_pay.png' : 'logo.png'; }
  }
  const b=document.getElementById('themeBadge');
  if(b){ b.textContent = (mode==='dark')?'DARK':(mode==='gray')?'GRAY':'WHITE'; }
}
// 테스트 순환룸: 10초마다 화이트→그레이→다크 (우상단에 현재 테마 배지)
function startThemeCycle(){
  if(window.__themeTimer){ clearInterval(window.__themeTimer); window.__themeTimer=null; }
  let b=document.getElementById('themeBadge');
  if(!b){ b=document.createElement('div'); b.id='themeBadge';
    b.style.cssText='position:fixed;top:12px;right:14px;z-index:99999;background:rgba(0,0,0,.6);color:#fff;font:800 14px/1 Pretendard,sans-serif;letter-spacing:1.5px;padding:8px 13px;border-radius:9px;pointer-events:none;';
    document.body.appendChild(b);
  }
  const seq=['white','gray','dark']; let i=0;
  setThemeMode(seq[0]);
  window.__themeTimer=setInterval(function(){ i=(i+1)%seq.length; setThemeMode(seq[i]); }, 10000);
}
function render(){
  const page=document.getElementById('page'),fitw=document.getElementById('fit');
  const key=(getParam('room')||'').toLowerCase();const room=ROOMS[key];
  // 테마: 기본 다크(전 회의실). 라이트로 되돌리려면 ?light=1(또는 ?dark=0), 그레이는 ?gray=1
  const themeMode = (getParam('light')==='1'||getParam('theme')==='light'||getParam('dark')==='0') ? 'white'
                  : (getParam('gray')==='1'||getParam('theme')==='gray') ? 'gray' : 'dark';
  fitw.classList.toggle('dark',!room);
  page.style.width='1920px';page.style.height='1080px';
  window.__iframeView=false;
  // ?room=calendar / ?room=door → 완성된 별도 파일을 그 파일로 '바로 이동'(리다이렉트)
  // (iframe 중첩은 TV Bro/GeckoView에서 크기 계산이 불안정 → 최상위 문서로 로드해야 뷰포트를 정확히 받음)
  const IFRAME_VIEWS={calendar:{src:'calendar.html',title:'회의실 스케줄'}, door:{src:'exec_door.html',title:'C레벨 회의실 문패'}};
  if(IFRAME_VIEWS[key]){
    const v=IFRAME_VIEWS[key];
    const u=new URL(v.src, location.href);
    // room 제외한 나머지 파라미터(cover, span, v 등)는 그대로 전달
    new URLSearchParams(location.search).forEach(function(val,k){ if(k!=='room') u.searchParams.set(k,val); });
    location.replace(u.toString());   // 히스토리 안 남기고 교체
    return;
  }
  if(!room){
    page.style.background='transparent';
    page.innerHTML=viewPicker();
    loadPickerStatuses();
    // 현황판 자동 갱신: 15초마다 캘린더 다시 조회 → 방금 잡은 일정도 곧 반영
    (function pollBoard(){ setTimeout(function(){ if(!getParam('room')){ loadPickerStatuses(); pollBoard(); } }, 15000); })();
    window.__isPicker=true; window.__ivRoom=false; window.__coverAlways=false; window.__videoRoom=false; window.__coverBase=false; setCoverLogo(false); refreshCover();
    applyPortrait();   // 세로/가로 반영
    startHeartbeat('board');   // 현황판 자체도 생존신호 전송
    refreshEventCover();   // 현황판에선 이미지 숨김(회의실 화면만 노출)
  } else {
    const isIvRoom=(room.type==="interview");
    const t=isIvRoom?TYPES.general:(TYPES[room.type]||TYPES.general); // 인터뷰룸도 내용은 일반회의실과 동일하게
    const isExec=(room.type==="exec"); // 임원/쪽방/알바(winery) → 상시 검정 로고 커버(그대로)
    window.__isPicker=false;
    window.__isPay=((room.office||'').indexOf('페이')===0);   // 로고 흰/오렌지 판단용
    startHeartbeat(key);   // 이 회의실 화면 생존신호 전송(방키 기준)
    window.__demo=(key.indexOf('test')===0); // 테스트룸 = 케이스 샘플 데이터
    window.__draft=!isExec;                  // exec 제외 전 회의실 = 확정 시안 B
    window.__sample=room.sample;
    window.__ivRoom=isIvRoom;
    window.__coverAlways=isExec;
    window.__videoRoom=!!t.video;
    setCoverLogo((room.office||'').indexOf('페이')===0);  // 페이 사무실이면 커버도 페이 로고
    window.__coverBase=window.__coverAlways; refreshCover();
    window.__portrait=false; page.classList.remove('portrait'); // 방 가이드는 항상 가로
    page.style.width='1920px';page.style.height='1080px';
    if(window.__altTimer){ clearInterval(window.__altTimer); window.__altTimer=null; }
    if(window.__themeTimer){ clearInterval(window.__themeTimer); window.__themeTimer=null; }
    if(window.__draft){
      page.innerHTML=draftLayout(room,t,key);
      if(room.langMode==='biling') bilingify(page);       // グルメ: 한·일 병기
    } else {
      page.innerHTML=sidebar(room,t)+mainStandard(room,t); // exec: 검정 커버로 가려짐
    }
    // 테마 적용(로고 색 포함). 테스트 순환룸이면 10초마다 화이트→그레이→다크
    if(room.themeCycle){ startThemeCycle(); } else { setThemeMode(themeMode); }
    refreshEventCover();   // 행사 이미지 전면 노출 구간이면 가이드 위에 이미지
    if(!window.__eventTimer){ window.__eventTimer=setInterval(refreshEventCover, 60000); }  // 08:00/23:00 경계 자동 전환
    document.title=room.name+' · 회의실 가이드';
    if(room.langMode==='alt'){                             // 메시: 한↔일 교대 송출
      startAltLang(room,t,key);
    } else if(room.fixed==='busy'){                        // 캘린더 미연동 룸 → 상시 사용중(주황) 고정
      (room.langMode==='biling') ? renderFixedBusyBiling() : renderFixedBusy();
    } else {
      // 15초 주기 폴링(+지터) → 서버가 요청 시 최신화하므로 신선도 ≈ 폴링 주기(약 15초)
      const calKey=room.cal||key;
      loadSchedule(calKey);
      (function poll(){ setTimeout(function(){ loadSchedule(calKey); poll(); }, 15000+Math.floor(Math.random()*5000)); })();
    }
  }
  fit();
}
window.addEventListener('resize',applyPortrait);   // 회전/리사이즈 시 방향 자동 감지 후 맞춤
render();
startPixelShift();                        // 잔상 방지 초미세 픽셀 시프트 시작
refreshCover();                           // 로드 시 커버 여부 반영
setInterval(refreshCover, 60000);         // 1분마다 시간 확인 → 커버 자동 전환
pkClockTick(); setInterval(pkClockTick, 15000);  // 현황판 시계

/* 마우스 커서 자동 숨김: 시작은 숨김 → 움직이면 표시 → 3초간 안 움직이면 다시 숨김 */
(function(){
  var root=document.documentElement, t;
  function hide(){ root.classList.add('nocursor'); }
  function show(){ root.classList.remove('nocursor'); clearTimeout(t); t=setTimeout(hide, 3000); }
  hide();
  ['mousemove','mousedown','wheel','touchstart'].forEach(function(ev){ document.addEventListener(ev, show, {passive:true}); });
})();

/* 새 배포 자동 감지 → 자동 새로고침 (스틱에서 수동 새로고침 불필요) */
var __deployStamp=null;
function __checkDeploy(){
  fetch('index.html?_t='+Date.now(),{method:'HEAD',cache:'no-store'})
    .then(function(r){
      var lm=r.headers.get('ETag')||r.headers.get('Last-Modified');
      if(lm){ if(__deployStamp && lm!==__deployStamp){ location.reload(); } __deployStamp=lm; }
    }).catch(function(){});
}
__checkDeploy();                         // 최초 기준값 기록
setInterval(__checkDeploy, 5*60*1000);   // 5분마다 새 배포 확인 → 있으면 자동 새로고침
</script>
<script>
/* 장시간 구동 시 TV Bro(GeckoView) 메모리 누적 → 크래시/멋대로 리로드 예방용 자동 새로고침.
   기본 180분. ?reload=N(분)으로 조정, ?reload=0 이면 끔. ?dbg=1 이면 좌하단에 마지막 로드 시각 표시.
   (calendar/door는 다른 파일로 리다이렉트되므로 이 타이머는 그쪽 파일의 것이 동작함) */
(function(){
  var MIN=90, m=location.search.match(/[?&]reload=(\d+)/); if(m){ MIN=parseInt(m[1],10); }
  if(MIN>0){ setTimeout(function(){ try{location.reload();}catch(e){} }, MIN*60000); }
  if(/[?&]dbg=1/.test(location.search)){ try{
    var el=document.createElement('div');
    el.style.cssText='position:fixed;left:4px;bottom:4px;z-index:2147483647;background:rgba(0,0,0,.8);color:#0f0;font:11px monospace;padding:3px 6px;pointer-events:none;';
    el.textContent='loaded '+new Date().toLocaleString('ko-KR')+' · reload '+MIN+'m';
    document.body.appendChild(el);
  }catch(e){} }
})();
</script>
