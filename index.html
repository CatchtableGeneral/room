<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>회의실 디스플레이</title>
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
  *{margin:0;padding:0;box-sizing:border-box;}
  html.nocursor, html.nocursor *{cursor:none !important;}  /* 유휴 시 마우스 커서 숨김(키오스크) */
  html,body{width:100%;height:100%;overflow:hidden;font-family:"Pretendard",sans-serif;background:#EBECEE;-webkit-font-smoothing:antialiased;color:#1F2124;word-break:keep-all;}
  .fit-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#EBECEE;overflow:hidden;}
  .fit-wrap.dark{background:radial-gradient(1100px 520px at 50% -8%, rgba(253,61,0,0.18), rgba(253,61,0,0) 62%), #0C0D11;}
  .page{width:1920px;height:1080px;background:#fff;position:relative;display:flex;flex:none;overflow:hidden;transform-origin:center center;}
  /* 인터뷰 진행 중 커버: 검정 배경 + 주황 로고만 (인터뷰룸 예약 시간대에만 표시) */
  #iv-cover{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:9999;}
  #iv-cover .iv-logo{font-size:72px;font-weight:900;letter-spacing:8px;color:#FD3D00;}
  #iv-cover .iv-logo-img{width:46vw;max-width:640px;height:auto;display:block;}
  #iv-cover .iv-wrap{display:flex;flex-direction:column;align-items:center;}
  #iv-cover .iv-slogan{color:#FF3D00;font-weight:700;font-size:34px;letter-spacing:2px;margin-bottom:16px;}

  /* ===== 사이드바 (코랄) ===== */
  .side{width:460px;flex:0 0 460px;background:linear-gradient(155deg,#FF6A3A 0%,#FD3D00 100%);color:#fff;padding:44px 50px;display:flex;flex-direction:column;position:relative;z-index:2;box-shadow:8px 0 24px rgba(0,0,0,0.16);}
  /* 화상회의실 : 그라데이션 없이 단색 로고 오렌지 */
  .side.solid{background:#FD3D00;}
  /* 임원 회의실 : 흰 배경 + 어두운 글씨 */
  .side.light{background:#FFFFFF;color:#1F2124;box-shadow:8px 0 24px rgba(0,0,0,0.10);}
  .side.light .logo{color:#FD3D00;}
  .side.light .rtitle{color:#1F2124;}
  .side.light .hr{background:rgba(0,0,0,0.12);}
  .side.light .ask{color:#5A5F66;}
  .side.light .ask b{color:#1F2124;}
  .side.light .sched-head{color:#1F2124;}
  .side.light .sched-status{background:#F1F2F4;color:#FD3D00;}
  .side.light .sch-item{background:#F4F5F7;border-left-color:#CED2D8;}
  .side.light .sch-item .t{color:#1F2124;}
  .side.light .sch-item .n{color:#5A5F66;}
  .side.light .sch-empty{background:#F4F5F7;color:#8A9099;}
  .side.light .bubble{background:#fff;color:#FD3D00;border:2px solid #FD3D00;}
  .side.light .now-tag{color:#1F2124;}
  .logo{font-size:30px;font-weight:900;letter-spacing:3px;}
  .logo-img{height:44px;width:auto;display:block;}
  .rtitle{margin-top:28px;font-size:42px;line-height:1.12;font-weight:800;letter-spacing:-0.03em;}
  .hr{height:1px;background:rgba(255,255,255,0.28);margin:26px 0 22px;}
  .ask{font-size:18px;line-height:1.4;}
  .ask .op{opacity:0.78;} .ask .sep{opacity:0.4;margin:0 10px;} .ask b{font-weight:600;}
  .sched{margin-top:30px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .sched-head{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:13px;}
  .sched-status{font-size:13px;font-weight:800;padding:4px 12px;border-radius:14px;background:#fff;color:#FD3D00;display:inline-flex;align-items:center;}
  .sched-status .sdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;}
  .sched-status.s-free .sdot{background:#2FCB84;box-shadow:0 0 8px #2FCB84;}
  .sched-status.s-busy .sdot{background:#FF2D55;box-shadow:0 0 8px #FF2D55;}
  .sched-status.s-prep .sdot{background:#FF9500;box-shadow:0 0 8px #FF9500;}
  .sched-status.s-loading .sdot{background:#c0c4cc;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.15}}
  .now-tag .blink{color:#FF2D55;animation:blink 1.1s infinite;}
  .sch-item.now .t .blink{color:#FF2D55;animation:blink 1.1s infinite;margin-right:3px;}
  .sch-item.free,.sch-item.soon{background:#fff;border-left:4px solid #2FCB84;box-shadow:0 3px 12px rgba(0,0,0,0.16);}
  .sch-item.free .free-line,.sch-item.soon .soon-line{display:block;font-size:14px;font-weight:800;color:#14A05C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sch-item.free .free-line .blink,.sch-item.soon .soon-line .blink{color:#2FCB84;animation:blink 1.1s infinite;margin-right:2px;}
  .sched-list.two .sch-item.free .free-line,.sched-list.two .sch-item.soon .soon-line{font-size:12.5px;}
  .sched-list.dense .sch-item.free .free-line,.sched-list.dense .sch-item.soon .soon-line{font-size:11.5px;}
  .sched-list{display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-height:0;overflow:hidden;}
  .sched-list.two{display:block;column-count:2;column-gap:8px;}
  .sched-list.two .sch-item{break-inside:avoid;margin-bottom:5px;}
  .sched-list.dense .sch-item{padding:5px 10px;margin-bottom:4px;}
  .sched-list.dense .sch-item .t{font-size:12px;}
  .sched-list.dense .sch-item .n{font-size:11px;}
  .sched-list.dense .sch-item.now .now-tag{font-size:11px;margin-bottom:3px;}
  .sched-list.dense .sch-item.past{padding:2px 10px;}
  .sch-item{background:rgba(255,255,255,0.15);border-radius:11px;padding:10px 14px;border-left:4px solid rgba(255,255,255,0.65);}
  .sch-item .t{font-size:16px;font-weight:800;white-space:nowrap;}
  .sch-item .n{font-size:14.5px;opacity:0.92;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sch-item.hasjoin{display:flex;align-items:center;gap:10px;}
  .sch-item.hasjoin .sch-main{flex:1;min-width:0;}
  .sch-join{flex:none;background:rgba(255,255,255,0.18);color:#fff;text-decoration:none;font-size:14px;font-weight:800;padding:8px 17px;border-radius:9px;white-space:nowrap;border:1.5px solid rgba(255,255,255,0.8);}
  .sch-join:hover{background:#fff;color:#FD3D00;}
  .sch-item.now .sch-join{background:#fff;color:#FD3D00;border-color:#FD3D00;}
  .sch-item.now .sch-join:hover{background:#FD3D00;color:#fff;}
  .sch-item.now{background:#fff;border-left:4px solid #FF2D55;box-shadow:0 3px 12px rgba(0,0,0,0.16);}
  .sch-item.now .t{color:#FD3D00;}
  .sch-item.now .n{color:#D6321E;opacity:1;}
  .sch-item.now .now-tag{font-size:12px;font-weight:800;margin-bottom:5px;letter-spacing:0.02em;color:#FF2D55;}
  .side.light .sch-item.now{background:#FFE7E3;}
  .side.light .sch-item.now .t{color:#FD3D00;}
  .side.light .sch-item.now .n{color:#D6321E;}
  .sch-item.past{opacity:0.5;display:flex;align-items:baseline;flex-wrap:nowrap;gap:7px;padding:3px 12px;}
  .sch-item.past .t{font-size:12px;white-space:nowrap;flex:none;}
  .sch-item.past .n{font-size:11px;margin-top:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sch-empty{font-size:14px;opacity:0.85;background:rgba(255,255,255,0.1);border-radius:12px;padding:14px;text-align:center;}
  .side-bottom{margin-top:14px;padding-top:0;flex:none;display:flex;flex-direction:column;gap:16px;}
  .pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.32);padding:11px 20px;border-radius:999px;font-size:17px;font-weight:600;}
  .bubble{align-self:flex-start;background:#fff;color:#FD3D00;padding:17px 24px;border-radius:22px 22px 22px 6px;font-size:20px;font-weight:700;line-height:1.4;box-shadow:0 16px 32px rgba(0,0,0,0.22), 0 4px 12px rgba(0,0,0,0.14);}

  /* ===== 테스트룸 초안: 왼쪽 스케줄 확대 ===== */
  .side.schbig{width:560px;flex:0 0 560px;flex-basis:560px;padding:34px 44px;}
  /* 위쪽(로고·방이름·문의)은 컴팩트하게 → 스케줄에 세로 공간 몰아주기 */
  .side.schbig .logo-img{height:34px;}
  .side.schbig .rtitle{margin-top:16px;font-size:34px;}
  .side.schbig .hr{margin:16px 0 14px;}
  .side.schbig .ask{font-size:15px;}
  .side.schbig .sched{margin-top:20px;}
  .side.schbig .sched-head{font-size:26px;margin-bottom:16px;}
  .side.schbig .sched-status{font-size:15px;padding:5px 14px;}
  .side.schbig .sched-list{gap:7px;}
  .side.schbig .sch-item{padding:11px 18px;border-radius:13px;}
  .side.schbig .sch-item .t{font-size:21px;line-height:1.3;}
  .side.schbig .sch-item .n{font-size:17px;margin-top:5px;line-height:1.3;}
  .side.schbig .sch-item.past{padding:6px 18px;}   /* 끝난 회의는 한 줄이라 더 얇게 */
  .side.schbig .sch-item.past .n{margin-top:0;}
  /* 시안 B: 스케줄 패널 대폭 확대 (가이드는 오른쪽으로 밀려 좁아짐) */
  .side.schbig.schbigB{width:900px;flex:0 0 900px;flex-basis:900px;}
  .side.schbig.schbigB .sched-list{column-count:2;column-gap:14px;display:block;}
  .side.schbig.schbigB .sch-item{break-inside:avoid;margin-bottom:8px;}
  .side.schbig.schbigB .rtitle{font-size:40px;}
  /* 시안 C: 스케줄 최대(2열, 1100px) + 가이드는 오른쪽에 좁게 유지 */
  .side.schbig.schbigC{width:1100px;flex:0 0 1100px;flex-basis:1100px;}
  .side.schbig.schbigC .rtitle{font-size:44px;}
  .side.schbig.schbigC .sched-head{font-size:28px;}
  .side.schbig.schbigC .sched-list{column-count:2;column-gap:16px;display:block;}
  .side.schbig.schbigC .sch-item{break-inside:avoid;margin-bottom:9px;}
  .side.schbig.schbigC .sch-item .t{font-size:22px;}
  .side.schbig.schbigC .sch-item .n{font-size:18px;}
  .side.schbig .sch-item.free .free-line,.side.schbig .sch-item.soon .soon-line{font-size:17px;}
  .side.schbig .sch-item.past .t{font-size:15px;}
  .side.schbig .sch-item.past .n{font-size:13.5px;}
  /* ===== 시안 공통: 세로 스택(스케줄 존 + 가이드) ===== */
  .vcol{width:100%;height:100%;display:flex;flex-direction:column;}
  .vcol .main{flex:1 1 auto;min-height:0;}
  .szone{flex:0 0 auto;background:linear-gradient(120deg,#FF6A3A 0%,#FD3D00 100%);color:#fff;}
  .szone.szone-bot{background:linear-gradient(120deg,#FD3D00 0%,#FF6A3A 100%);}
  .szone-in{padding:26px 60px;}
  .dhd{display:flex;align-items:center;gap:20px;}
  .dhd-logo{height:30px;width:auto;}
  .dhd-rt{font-size:32px;font-weight:800;letter-spacing:-0.02em;flex:1;}
  .dhd-st{font-size:16px;padding:6px 16px;flex:none;}
  /* A: 가로 타임라인 */
  .tl{position:relative;height:150px;margin-top:26px;}
  .tl-track{position:absolute;inset:0;background:rgba(255,255,255,0.12);border-radius:16px;}
  .tl-tick{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,0.28);}
  .tl-tick span{position:absolute;bottom:-24px;left:-16px;font-size:13px;font-weight:700;color:rgba(255,255,255,0.85);}
  .tl-blk{position:absolute;top:18px;bottom:18px;background:#fff;color:#FD3D00;border-radius:11px;padding:9px 12px;overflow:hidden;box-shadow:0 5px 14px rgba(0,0,0,0.22);display:flex;flex-direction:column;justify-content:center;}
  .tl-blk.on{background:#FFE7E3;outline:3px solid #fff;}
  .tl-blk.past{opacity:0.5;}
  .tl-t{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tl-tm{font-size:12px;font-weight:700;opacity:0.85;margin-top:2px;}
  .tl-now{position:absolute;top:-8px;bottom:-8px;width:3px;background:#14161C;border-radius:2px;}
  .tl-now span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;background:#14161C;color:#fff;padding:2px 8px;border-radius:7px;white-space:nowrap;}
  /* B: Now / Next 카드 */
  .nn{display:flex;gap:22px;margin-top:22px;align-items:stretch;}
  .nn-now{flex:1.7;background:#fff;color:#1F2124;border-radius:20px;padding:26px 32px;box-shadow:0 12px 30px rgba(0,0,0,0.22);display:flex;flex-direction:column;justify-content:center;min-height:190px;}
  .nn-now .nn-lbl{font-size:17px;font-weight:800;color:#FF2D55;}
  .nn-now.free .nn-lbl{color:#14A05C;}
  .nn-now .nn-title{font-size:38px;font-weight:800;margin-top:10px;letter-spacing:-0.02em;}
  .nn-now .nn-time{font-size:21px;color:#5A5F66;margin-top:8px;font-weight:600;}
  .nn-now{flex-direction:row;align-items:stretch;gap:24px;}
  .nn-now .nn-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .nn-next{display:flex;flex-direction:row;align-items:stretch;gap:14px;}
  .nn-next .nn-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .nn-join{flex:0 0 auto;align-self:center;width:120px;height:120px;display:flex;align-items:center;justify-content:center;background:#FD3D00;color:#fff;text-decoration:none;font-size:20px;font-weight:800;border-radius:16px;box-shadow:0 6px 16px rgba(253,61,0,0.3);white-space:nowrap;padding:0;}
  .nn-join.sm{width:64px;height:64px;background:#fff;color:#FD3D00;font-size:13.5px;box-shadow:0 4px 10px rgba(0,0,0,0.15);}
  .nn-col{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0;}
  .nn-next{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.32);border-radius:16px;padding:18px 22px;}
  .nn-next .nn-lbl{font-size:14px;font-weight:800;opacity:0.9;}
  .nn-next .nn-title{font-size:23px;font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nn-next .nn-time{font-size:15px;opacity:0.9;margin-top:3px;}
  .nn-rest{flex:1;min-height:0;overflow:hidden;}
  .nn-rest-h{font-size:13px;font-weight:800;opacity:0.85;margin-bottom:7px;letter-spacing:0.03em;}
  .nn-ri{font-size:15px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.16);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nn-ri span{font-weight:800;margin-right:9px;}
  /* C: 하단 가로 스트립 */
  .strip{display:flex;gap:16px;margin-top:18px;overflow:hidden;}
  .stc{flex:0 0 300px;background:#fff;color:#1F2124;border-radius:16px;padding:18px 22px;box-shadow:0 8px 20px rgba(0,0,0,0.2);}
  .stc.on{background:#FFE7E3;outline:3px solid #fff;}
  .stc-tm{font-size:15px;font-weight:800;color:#FD3D00;}
  .stc-t{font-size:21px;font-weight:800;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stc-now{font-size:13px;font-weight:800;color:#FF2D55;margin-top:6px;}
  .stc.empty{flex:1;color:#fff;background:rgba(255,255,255,0.14);box-shadow:none;font-weight:700;display:flex;align-items:center;justify-content:center;}
  /* D: 출발안내판 보드 (오렌지) */
  .board{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
  .bd-row{display:flex;align-items:center;gap:24px;background:rgba(255,255,255,0.13);border-left:5px solid rgba(255,255,255,0.45);border-radius:11px;padding:14px 26px;}
  .bd-row.on{background:#fff;border-left-color:#fff;box-shadow:0 6px 16px rgba(0,0,0,0.18);}
  .bd-tm{flex:0 0 200px;font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:0.5px;}
  .bd-nm{flex:1;font-size:27px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bd-row.on .bd-tm,.bd-row.on .bd-nm{color:#FD3D00;}
  .bd-st{flex:0 0 auto;font-size:17px;font-weight:800;padding:7px 16px;border-radius:999px;}
  .bd-st.on{background:#FD3D00;color:#fff;}
  .bd-st.soon{background:rgba(255,255,255,0.22);color:#fff;}
  .bd-empty{justify-content:center;color:#fff;opacity:0.85;font-size:22px;}
  .bd-more{font-size:16px;font-weight:700;color:#fff;opacity:0.85;padding:4px 26px;}
  /* E: 카운트다운 히어로 */
  .szone.szone-hero .szone-in{padding-bottom:36px;}
  .cd{margin-top:20px;text-align:center;}
  .cd-lbl{font-size:22px;font-weight:800;opacity:0.95;}
  .cd-big{font-size:96px;font-weight:900;line-height:1.05;letter-spacing:-0.03em;margin-top:6px;}
  .cd-sub{font-size:20px;font-weight:600;opacity:0.9;margin-top:8px;}
  .cd.free .cd-big{font-size:80px;}
  /* F: 오전/오후 2분할 */
  .ampm{display:flex;gap:22px;margin-top:22px;}
  .ap-col{flex:1;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.2);border-radius:18px;padding:18px 22px;min-height:230px;}
  .ap-h{font-size:20px;font-weight:800;margin-bottom:12px;letter-spacing:0.04em;opacity:0.95;}
  .ap-i{display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.16);}
  .ap-i.on{background:rgba(255,255,255,0.14);border-radius:8px;padding:10px 12px;margin:0 -12px;}
  .ap-i.past{opacity:0.5;}
  .ap-tm{flex:0 0 128px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .ap-nm{flex:1;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ap-empty{opacity:0.7;font-size:16px;padding:12px 0;}
  /* G: 반원 데이-클락 */
  .clockwrap{width:100%;max-width:560px;height:250px;display:block;margin:8px auto 0;}
  .ck-track{stroke:rgba(255,255,255,0.16);stroke-width:26;stroke-linecap:round;}
  .ck-seg{stroke:#fff;stroke-width:26;stroke-linecap:round;}
  .ck-seg.on{stroke:#FFD9CF;}
  .ck-seg.past{stroke:rgba(255,255,255,0.4);}
  .ck-tk{fill:rgba(255,255,255,0.85);font-size:15px;font-weight:700;}
  .ck-now{stroke:#14161C;stroke-width:3.5;}
  .ck-nowdot{fill:#14161C;stroke:#fff;stroke-width:2;}
  .ck-c1{fill:#fff;font-size:16px;font-weight:800;}
  .ck-c2{fill:#fff;font-size:24px;font-weight:800;}
  /* ===== 시안 공통: 1080 프레임을 꽉 채우도록 균형 ===== */
  .vcol{overflow:hidden;}
  /* 스케줄 존은 내용 높이만큼, 가이드(main)가 나머지를 꽉 채움 */
  .vcol .szone{flex:0 0 auto;}
  .vcol .szone-in{padding:26px 64px;}
  /* 가이드 2단: 왼쪽(말풍선↑/에티켓↓) | 오른쪽(미러링: 유선|무선) */
  .vcol .dguide{flex:1 1 auto;min-height:0;overflow:hidden;background:#F5F3ED;padding:24px 64px;display:flex;}
  .vcol .dg-in{width:100%;height:100%;display:flex;flex-direction:row;gap:18px;align-items:stretch;}
  .vcol .dg-left{flex:0 0 19%;display:flex;flex-direction:column;gap:16px;min-height:0;}
  /* 말풍선: 위쪽, 대각 유지 (cb-top 오른쪽위 / cb-bot 왼쪽아래) */
  .vcol .dg-left .topbubble{flex:0 0 auto;margin-left:0;padding:2px 0 4px;gap:18px;overflow:visible;}

const PICK_SLOT={};
// '예약' 클릭 → 그 회의실이 초대된 구글 캘린더 예약창을 본인 계정으로 새 탭에 염 (안내된 시각부터 기본 1시간)
function bookRoom(cal,name,key){
  const q=15*60000;
  const slot=PICK_SLOT[key];
  let s=(slot&&slot.start)?slot.start:Math.floor(Date.now()/q)*q;
  let e=s+60*60000; // 기본 1시간
  if(slot&&slot.end&&e>slot.end) e=slot.end; // 다음 예약 전까지로 제한
  const f=(ms)=>{const d=new Date(ms),p=n=>('0'+n).slice(-2);return ''+d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+p(d.getUTCHours())+p(d.getUTCMinutes())+'00Z';};
  const url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(name)+'&add='+encodeURIComponent(cal)+'&dates='+f(s)+'/'+f(e);
  const w=Math.min(960,screen.width-60),hgt=Math.min(780,screen.height-80),left=Math.max(0,Math.round((screen.width-w)/2)),top=Math.max(0,Math.round((screen.height-hgt)/2));
  const win=window.open(url,'roombook','width='+w+',height='+hgt+',left='+left+',top='+top);
  if(win){try{win.opener=null;win.focus();}catch(e){}}
}

  fetch(base,{credentials:'omit'}).then(r=>r.json()).then(d=>ok((d&&d.events)||[])).catch(()=>{

// 회의실 선택화면: 각 방의 "지금" 사용 가능 여부 계산 (renderSched와 동일 규칙)
function pickAvail(events){
  events=events||[];
  const now=Date.now();
  const MG=15*60000;
  const _eod=new Date();_eod.setHours(23,59,59,0);const eod=_eod.getTime();
  const sorted=events.slice().sort((a,b)=>a.start-b.start);
  const _cur=events.find(e=>now>=e.start&&now<e.end);       // 지금 진행 중인 회의
  const title=_cur?(_cur.title||''):'';
  const busy=!!_cur;
  const nx=sorted.filter(e=>e.start>now);
  const nextStart=nx.length?nx[0].start:eod;
  const availableNow=!busy && (nx.length===0 || (nextStart-now)>=MG); // 예정 회의 없거나 다음까지 15분 이상이면 사용 가능
  const durTxt=(a,b)=>{const m=Math.round((b-a)/60000);return m>=60?(Math.floor(m/60)+'시간'+(m%60?' '+(m%60)+'분':'')):(m+'분');};
  const slot=(s,endMs,open)=> open ? (fmt(s)+' 이후부터 쭉 가능') : (fmt(s)+'~'+fmt(endMs)+' ('+durTxt(s,endMs)+') 예약 가능');
  if(availableNow){
    const sR=Math.floor(now/MG)*MG;
    return {cls:'free',txt:'지금 사용 가능 · '+slot(sR,nextStart,!nx.length),startMs:sR,endMs:nx.length?nextStart:null,title:''};
  }
  // 사용 중 / 곧 회의 시작 → 다음 사용 가능 시각(15분 이상 비는 첫 시점, 연속회의 감안)
  let cursor=now, changed=true;
  while(changed){ changed=false;
    for(let i=0;i<sorted.length;i++){ const e=sorted[i]; if(e.end>cursor && e.start<=cursor+MG){ cursor=e.end; changed=true; } }
  }
  const base=busy?'사용 중':'곧 회의 시작';
  const cls=busy?'busy':'prep';
  if(cursor>=eod) return {cls:cls,txt:base+' · 오늘 종일',startMs:null,endMs:null,title:title};
  const after=sorted.filter(e=>e.start>cursor);
  return {cls:cls,txt:base+' · '+slot(cursor, after.length?after[0].start:eod, !after.length),startMs:cursor,endMs:after.length?after[0].start:null,title:title};
}

function renderSched(events,mode){
  events=events||[];
  const loading=(mode==='loading');
  const stEl=document.getElementById('schStatus');
  const now=Date.now();const busy=events.some(e=>now>=e.start&&now<e.end);
  const MINGAP=15*60000; // 구글 캘린더 15분 단위 → 15분 미만 빈틈은 사용 불가
  const _eod=new Date();_eod.setHours(23,59,59,0);const eodMs=_eod.getTime();
  const _next=events.filter(e=>e.start>now).sort((a,b)=>a.start-b.start);
  const nextStart=_next.length?_next[0].start:eodMs;
  const availableNow=!busy && (_next.length===0 || (nextStart-now)>=MINGAP); // 예정 회의가 없거나, 다음 회의까지 15분 이상이면 사용 가능
  if(stEl){
    let cls,label;
    if(loading){cls='s-loading';label='확인 중';}
    else if(busy){cls='s-busy';label='사용 중';}
    else if(availableNow){cls='s-free';label='사용 가능';}
    else {cls='s-prep';label='다음 회의 준비중';} // 회의 중은 아니나 다음 회의까지 15분 미만
    stEl.className='sched-status '+cls;
    stEl.innerHTML='<span class="sdot"></span>'+label;
  }
  // 인터뷰룸: 지금 진행 중인 예약의 제목에 인터뷰 키워드가 있을 때만 검정 커버 (일반 회의는 가이드 유지)
  const _cur=events.find(e=>now>=e.start&&now<e.end);
  const _isIv=!!(_cur && (_cur.iv || /인터뷰|면접|interview/i.test(_cur.title||''))); // careers@ 예약(iv) 또는 제목 키워드
  window.__coverBase=(window.__coverAlways || (window.__ivRoom && _isIv)); refreshCover();
  // 시안(테스트룸) 형태별 분기 — 세로 리스트 대신 다른 형태로 렌더
  if(window.__draft){ renderNN(events,now); return; }  // 확정 시안 B(Now/Next)
  const listEl=document.getElementById('schList'); if(!listEl)return;
  if(loading && !events.length){listEl.className='sched-list';listEl.innerHTML=`<div class="sch-empty">일정을 불러오는 중…</div>`;return;}
  // 지금 비어있으면 "사용 가능" 슬롯을 타임라인에 카드로 끼워넣기 (진행중 카드와 동일 뷰)
  let items=events.slice();
  if(!loading){
    // 지금~하루 끝까지의 모든 빈 시간대(gap, 15분 이상)를 "예약 가능" 카드로 채움
    const fut=events.filter(e=>e.end>now).sort((a,b)=>a.start-b.start);
    let cursor=now;
    fut.forEach(e=>{
      if(e.start-cursor>=MINGAP){ items.push({__slot:true,active:(cursor<=now+1000),start:cursor,end:e.start,hasNext:true}); }
      cursor=Math.max(cursor,e.end);
    });
    if(eodMs-cursor>=MINGAP){ items.push({__slot:true,active:(cursor<=now+1000),start:cursor,end:eodMs,hasNext:false}); }
  }
  if(!items.length){listEl.className='sched-list';listEl.innerHTML=`<div class="sch-empty">오늘 예약이 없습니다</div>`;return;}
  const itemsHtml=items.sort((a,b)=>a.start-b.start).map(e=>{
    if(e.__slot){
      if(e.active){
        const q=15*60000; let sR=Math.floor(now/q)*q; // 지금 속한 15분 블록의 시작(이미 비어있으므로)
        const tt=e.hasNext?(fmt(sR)+'~'+fmt(e.end)):(fmt(sR)+'부터');
        return `<div class="sch-item free"><span class="free-line"><span class="blink">●</span> 사용 가능 <b>${tt}</b></span></div>`;
      }
      const tt=e.hasNext?(fmt(e.start)+'~'+fmt(e.end)):(fmt(e.start)+' 이후');
      return `<div class="sch-item soon"><span class="soon-line"><span class="blink">●</span> 예약 가능 <b>${tt}</b></span></div>`;
    }
    const on=now>=e.start&&now<e.end, past=e.end<=now;
    const canJoin=window.__videoRoom && e.meet && !past; // 화상회의실 + Meet 링크 있고 안 지난 회의
    const cls='sch-item'+(on?' now':'')+(past?' past':'')+(canJoin?' hasjoin':'');
    const timeTxt=fmt(e.start)+' – '+fmt(e.end);
    if(past){ // 끝난 회의: 시간+제목 한 줄
      return `<div class="${cls}"><span class="t">${timeTxt}</span><span class="n">${e.title||"예약됨"}</span></div>`;
    }
    const jb=canJoin?`<a class="sch-join" href="${e.meet}" target="_blank" rel="noopener">참여</a>`:'';
    const tLine=on?`<span class="blink">●</span> 진행 중 · ${timeTxt}`:timeTxt;  // 진행중은 시간과 한 줄로(2줄 유지)
    return `<div class="${cls}"><div class="sch-main"><div class="t">${tLine}</div><div class="n">${e.title||"예약됨"}</div></div>${jb}</div>`;
  }).join("");
  // 자동 맞춤: 1열로 그려보고, 세로/가로로 넘치면 2열 → 그래도 넘치면 촘촘 모드
  listEl.className='sched-list';
  listEl.innerHTML=itemsHtml;
  const over=()=>listEl.clientHeight>0 && (listEl.scrollHeight>listEl.clientHeight+2 || listEl.scrollWidth>listEl.clientWidth+2);
  if(over()){ listEl.className='sched-list two'; if(over()){ listEl.className='sched-list two dense'; } }
}

function draftGuide(room,t){
  const wired=`<div class="cc-col cc-wired">${CARD_WIRED}${WIRED_TIP}</div>`;
  const wl=`<div class="cc-col cc-wl"><div class="wl-pair">${cardWin(room)}${cardMac(room)}</div>${WL_TIP}</div>`;
  const guide=guideSection("TV 미러링 가이드","유선·무선으로 노트북 화면 연결","conn2col",wired+wl);
  const etq=etqSection("회의실 사용 에티켓","다음 사용자를 위해 지켜주세요",
    [["⏰","이용시간 준수"],[PWR_OFF,"TV전원 OFF금지"],["🗑️","쓰레기 정리"],["🪑","자리 정리"],["💡","소등 후 퇴실"]]);
  const banner=t.video?`<div class="vbanner dg-vbanner"><span class="vb-ic">📹</span><span class="vb-tx">화상회의는 위쪽 스케줄에서 <b>'참여'</b>만 누르면 끝 · 종료되면 <b>창을 닫아주세요</b></span></div>`:'';
  return `<main class="main dguide"><div class="dg-in"><div class="dg-left">${bubbleTop(t)}${etq}</div><div class="dg-right">${banner}${guide}</div></div></main>`;
}
function draftLayout(room,t,key){
  const guide=draftGuide(room,t);
  return `<div class="vcol"><div class="szone"><div class="szone-in">${draftHeader(room)}<div class="nn"><div class="nn-now" id="nnNow"></div><div class="nn-col"><div class="nn-next" id="nnNext"></div><div class="nn-rest" id="nnRest"></div></div></div></div></div>${guide}</div>`;
}
// 케이스별 데모 일정: 빈방/사용중/곧시작/종일/여유
function caseEvents(name){
  const M=60000, base=Math.floor(Date.now()/(30*M))*30*M;
  const mk=(s,e,title)=>({title,start:base+s*M,end:base+e*M});
  if(name==='empty') return [];
  if(name==='busy')  return [mk(-40,20,'주간 팀 스크럼'), mk(120,180,'제품 리뷰 미팅')];
  if(name==='soon')  return [mk(10,70,'신규 입사자 온보딩'), mk(150,210,'디자인 싱크')];
  if(name==='full'){ const t=['오전 스탠드업','제품 리뷰','1:1 면담','디자인 싱크','마케팅 회의','스프린트 플래닝','고객사 미팅','QA 점검','분기 회고']; const a=[]; for(let i=-1;i<8;i++) a.push(mk(i*60,i*60+55,t[i+1]||'회의')); return a; }
  return [mk(60,120,'주간 팀 회의'), mk(180,210,'1:1 면담'), mk(260,320,'고객사 미팅')]; // few
}
// B: 지금 / 다음 대형 카드 + 이후 미니 리스트
function renderNN(events,now){
  const cur=events.find(e=>now>=e.start&&now<e.end);
  const up=events.filter(e=>e.start>now).sort((a,b)=>a.start-b.start);
  const nowEl=document.getElementById('nnNow'),nextEl=document.getElementById('nnNext'),restEl=document.getElementById('nnRest');
  const joinBtn=(e,cls)=> (window.__videoRoom && e) ? `<a class="nn-join${cls?' '+cls:''}" href="${e.meet||'#'}" target="_blank" rel="noopener">참여${cls?'':'하기'}</a>` : '';
  if(nowEl){ nowEl.className='nn-now'+(cur?' busy':' free');
    nowEl.innerHTML=cur
      ? `<div class="nn-main"><div class="nn-lbl">● 지금 진행 중</div><div class="nn-title">${cur.title||'예약됨'}</div><div class="nn-time">${fmt(cur.start)} – ${fmt(cur.end)}</div></div>${joinBtn(cur,'')}`
      : `<div class="nn-main"><div class="nn-lbl free">● 지금 사용 가능</div><div class="nn-title">비어 있어요</div><div class="nn-time">${up.length?('다음 회의 '+fmt(up[0].start)+' 전까지 이용 가능'):'오늘 남은 예약 없음'}</div></div>`;
  }
  if(nextEl){ const nx=up[0];
    nextEl.innerHTML=nx?`<div class="nn-main"><div class="nn-lbl">다음 회의</div><div class="nn-title">${nx.title||'예약됨'}</div><div class="nn-time">${fmt(nx.start)} – ${fmt(nx.end)}</div></div>${joinBtn(nx,'sm')}`:`<div class="nn-main"><div class="nn-lbl">다음 회의</div><div class="nn-title" style="opacity:.55">예정 없음</div></div>`;
  }
  if(restEl){ const rest=up.slice(1,6);
    restEl.innerHTML=rest.length?('<div class="nn-rest-h">이후 일정</div>'+rest.map(e=>`<div class="nn-ri"><span>${fmt(e.start)}</span> ${e.title||'예약됨'}</div>`).join('')):'';
  }
}
function fit(){
  const page=document.getElementById('page');
  // 화면 비율에 따라 자동 판별(기본 auto):
  //  · 거의 16:9(회의실 TV 풀스크린) → 덮어서(cover) 꽉 채움. 회색 여백 0, 잘림 0.
  //  · 비율이 많이 어긋난 화면(PC 브라우저 창 등) → 여백 방식(contain)으로 빠져 너무 커지지 않음.
  // 강제하려면 URL에 ?fit=cover(항상 꽉) / ?fit=contain(항상 여백) 을 붙이면 됨.
  const mode=(getParam('fit')||'auto').toLowerCase();
  const a=window.__rotAngle||0;
  const pw=parseFloat(page.style.width)||1920, ph=parseFloat(page.style.height)||1080;
  const swap=(a===90||a===270);           // 회전 후 경계 크기(가로·세로 스왑)
  const bw=swap?ph:pw, bh=swap?pw:ph;
  const rw=window.innerWidth/bw, rh=window.innerHeight/bh;
  const cover=Math.max(rw,rh), contain=Math.min(rw,rh);
  let base;
  if(mode==='cover') base=cover;
  else if(mode==='contain') base=contain;
  else base=(cover/contain-1 <= 0.06) ? cover : contain; // 잘림 6% 이내면 꽉, 넘으면 여백
  // 미세조정용(선택): ?safe=0.95 처럼 붙이면 그만큼 안쪽으로 줄여줌. 기본 1.
  let safe=parseFloat(getParam('safe'));
  if(!(safe>0.5 && safe<=1)) safe=1;
  // transform 스케일 (GPU 가속, 샤오미 등 정품 크로미움에서 선명)
  const s=base*safe;
  const rot=a?('rotate('+a+'deg) '):'';
  page.style.transform='translate('+__shift[0]+'px,'+__shift[1]+'px) '+rot+'scale('+s+')';
}
// 잔상 방지용 초미세 픽셀 시프트: 75초마다 화면 전체를 최대 3px, 2.5초에 걸쳐 천천히 이동(눈엔 거의 안 보임)
let __shift=[0,0];
function startPixelShift(){
  const page=document.getElementById('page'); if(!page) return;
  page.style.transition='transform 2.5s ease';            // '이동'만 부드럽게 (스케일은 최초 1회라 영향 없음)
  // 확인용: URL에 ?shiftpx=40&shiftsec=2 처럼 붙이면 크게·자주 움직여 눈으로 볼 수 있음. 기본 3px / 75초.
  let amp=parseInt(getParam('shiftpx'),10); if(!(amp>0)) amp=3;
  let sec=parseFloat(getParam('shiftsec')); if(!(sec>0)) sec=75;
  const pts=[[0,0],[1,0],[1,1],[0,1],[0.66,0.33],[0.33,0.66],[1,0.33],[0,0.66]];
  const seq=pts.map(p=>[Math.round(p[0]*amp),Math.round(p[1]*amp)]);
  let i=0;
  setInterval(function(){ i=(i+1)%seq.length; __shift=seq[i]; fit(); }, sec*1000);
}
// 야간(23:30~07:30)엔 모든 화면을 검정+로고 커버로. (?night=1 강제ON / ?night=0 강제OFF — 확인용)
// 야간 23:00~07:50 (?night=1/0 확인용)
function isNight(){
  const f=getParam('night'); if(f==='1')return true; if(f==='0')return false;
  const d=new Date(); const m=d.getHours()*60+d.getMinutes();
  return m>=(23*60) || m<(7*60+50);
}
// 점심 12:00~12:50 (?lunch=1/0)
function isLunch(){
  const f=getParam('lunch'); if(f==='1')return true; if(f==='0')return false;
  const d=new Date(); const m=d.getHours()*60+d.getMinutes();
  return m>=(12*60) && m<(12*60+50);
}
// 주말 토·일 19:00~09:50 (?weekend=1/0)
function isWeekend(){
  const f=getParam('weekend'); if(f==='1')return true; if(f==='0')return false;
  const d=new Date(); const g=d.getDay(); if(!(g===0||g===6)) return false;
  const m=d.getHours()*60+d.getMinutes();
  return m>=(19*60) || m<(9*60+50);
}
// 커버 표시 = 야간 이거나, 낮에도 커버가 필요한 방(임원/와이너리 상시 · 인터뷰 진행중)일 때
window.__coverBase=false;
function refreshCover(){
  const c=document.getElementById('iv-cover'); if(!c)return;
  // 선택 화면(현황판)은 야간 커버 예외 — 방 화면만 야간에 덮음
  c.style.display=(((!window.__isPicker) && (isNight()||isLunch()||isWeekend()))||window.__coverBase)?'flex':'none';
}
// 커버(검정 배경) 로고: 페이 사무실이면 페이 로고, 그 외엔 CATCHTABLE
function setCoverLogo(pay){
  const cov=document.getElementById('iv-cover'); if(!cov)return;
  const txt=pay?'CATCHTABLE PAY':'CATCHTABLE';
  const src=pay?'logo_pay_cover.png':'logo_cover.png';  // 커버는 오렌지 버전 (사이드바는 흰색 logo_pay.png)
  const img=document.createElement('img');
  img.className='iv-logo-img'; img.src=src; img.alt=txt;
  img.onerror=function(){ this.outerHTML='<div class="iv-logo">'+txt+'</div>'; };
  cov.innerHTML=''; cov.appendChild(img);
}
function render(){
  const page=document.getElementById('page'),fitw=document.getElementById('fit');
  const key=(getParam('room')||'').toLowerCase();const room=ROOMS[key];
  const dark=(getParam('theme')==='dark');                 // 본문 다크 테마 미리보기
  page.classList.toggle('theme-dark',dark);
  fitw.classList.toggle('dark',!room);
  page.style.width='1920px';page.style.height='1080px';
  if(!room){
    page.style.background='transparent';
    page.innerHTML=viewPicker();
    loadPickerStatuses();
    // 현황판 자동 갱신: 15초마다 캘린더 다시 조회 → 방금 잡은 일정도 곧 반영
    (function pollBoard(){ setTimeout(function(){ if(!getParam('room')){ loadPickerStatuses(); pollBoard(); } }, 15000); })();
    window.__isPicker=true; window.__ivRoom=false; window.__coverAlways=false; window.__videoRoom=false; window.__coverBase=false; setCoverLogo(false); refreshCover();
    applyPortrait();   // 세로/가로 반영
  } else {
    const isIvRoom=(room.type==="interview");
    const t=isIvRoom?TYPES.general:(TYPES[room.type]||TYPES.general); // 인터뷰룸도 내용은 일반회의실과 동일하게
    const isExec=(room.type==="exec"); // 임원/쪽방/알바(winery) → 상시 검정 로고 커버(그대로)
    window.__isPicker=false;
    window.__demo=(key.indexOf('test')===0); // 테스트룸 = 케이스 샘플 데이터
    window.__draft=!isExec;                  // exec 제외 전 회의실 = 확정 시안 B
    window.__sample=room.sample;
    window.__ivRoom=isIvRoom;
    window.__coverAlways=isExec;
    window.__videoRoom=!!t.video;
    setCoverLogo((room.office||'').indexOf('페이')===0);  // 페이 사무실이면 커버도 페이 로고
    window.__coverBase=window.__coverAlways; refreshCover();
    window.__portrait=false; page.classList.remove('portrait'); // 방 가이드는 항상 가로
    page.style.width='1920px';page.style.height='1080px';page.style.background=dark?'#14161C':'#fff';
    if(window.__draft){
      page.innerHTML=draftLayout(room,t,key); // 확정 시안 B
    } else {
      page.innerHTML=sidebar(room,t)+mainStandard(room,t); // exec: 검정 커버로 가려짐
    }
    document.title=room.name+' · 회의실 가이드';
    // 15초 주기 폴링(+지터) → 서버가 요청 시 최신화하므로 신선도 ≈ 폴링 주기(약 15초)
    const calKey=room.cal||key;
    loadSchedule(calKey);
    (function poll(){ setTimeout(function(){ loadSchedule(calKey); poll(); }, 15000+Math.floor(Math.random()*5000)); })();
  }
  fit();
}
window.addEventListener('resize',applyPortrait);   // 회전/리사이즈 시 방향 자동 감지 후 맞춤
render();
startPixelShift();                        // 잔상 방지 초미세 픽셀 시프트 시작
refreshCover();                           // 로드 시 커버 여부 반영
setInterval(refreshCover, 60000);         // 1분마다 시간 확인 → 커버 자동 전환
pkClockTick(); setInterval(pkClockTick, 15000);  // 현황판 시계

/* 마우스 커서 자동 숨김: 시작은 숨김 → 움직이면 표시 → 3초간 안 움직이면 다시 숨김 */
(function(){
  var root=document.documentElement, t;
  function hide(){ root.classList.add('nocursor'); }
  function show(){ root.classList.remove('nocursor'); clearTimeout(t); t=setTimeout(hide, 3000); }
  hide();
  ['mousemove','mousedown','wheel','touchstart'].forEach(function(ev){ document.addEventListener(ev, show, {passive:true}); });
})();

/* 새 배포 자동 감지 → 자동 새로고침 (스틱에서 수동 새로고침 불필요) */
var __deployStamp=null;
function __checkDeploy(){
  fetch('index.html?_t='+Date.now(),{method:'HEAD',cache:'no-store'})
    .then(function(r){
      var lm=r.headers.get('ETag')||r.headers.get('Last-Modified');
      if(lm){ if(__deployStamp && lm!==__deployStamp){ location.reload(); } __deployStamp=lm; }
    }).catch(function(){});
}
__checkDeploy();                         // 최초 기준값 기록
setInterval(__checkDeploy, 5*60*1000);   // 5분마다 새 배포 확인 → 있으면 자동 새로고침
</script>
